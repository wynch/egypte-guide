te de premier monothéisme de l'histoire. L'expérience mourut avec lui, et son fils Toutânkhamon rétablit aussitôt les anciens dieux."},{"id":"egypte-copte-islamique","title":"L'Égypte copte et islamique : après les pharaons","days":[2],"locations":["Le Caire"],"sites":["Le Caire islamique","Citadelle de Saladin"],"body":"L'histoire de l'Égypte ne s'arrête pas avec Cléopâtre. Après la conquête romaine (-30), le pays devient chrétien parmi les premiers : c'est l'**Égypte copte**. Le mot « copte » vient tout simplement du grec *aigyptos* (Égypte) : les Coptes sont donc, étymologiquement, « les Égyptiens ». Selon la tradition, c'est l'évangéliste **saint Marc** qui apporta le christianisme à Alexandrie au Ier siècle. L'Égypte inventa le **monachisme** — les premiers ermites et monastères du désert, saint Antoine et saint Pacôme — qui essaima dans tout le monde chrétien. Aujourd'hui encore, les Coptes forment une importante minorité chrétienne, avec leur propre pape et une liturgie héritière de la langue de l'Égypte antique.\n\nEn **641**, les cavaliers arabes du général **Amr ibn al-As** conquièrent l'Égypte au nom du jeune islam. Le pays devient musulman et arabophone, tout en gardant longtemps une majorité chrétienne. Une succession de dynasties façonne alors l'Égypte médiévale : les **Fatimides** chiites, venus de Tunisie, fondent **Le Caire** en 969 et la célèbre université-mosquée **al-Azhar**, encore aujourd'hui la plus haute autorité de l'islam sunnite. Puis vient **Saladin** (XIIe siècle), fondateur de la dynastie ayyoubide, adversaire chevaleresque de Richard Cœur de Lion et bâtisseur de la citadelle du Caire.\n\nLui succèdent les **Mamelouks** (1250-1517), une extraordinaire caste militaire d'anciens esclaves-soldats devenus maîtres du pays. Redoutables guerriers — ils arrêtèrent les Mongols —, ils furent aussi de grands mécènes : la vieille ville du Caire doit à leur goût ses plus belles mosquées, médersas et façades de pierre ajourée. En **1517**, les **Ottomans** annexent l'Égypte, qui devient une province de l'Empire pour trois siècles.\n\nSur place, au Caire islamique, cette stratification est visible : minarets fatimides, murailles de Saladin, dômes mamelouks, mosquée ottomane de Mohamed Ali. Un même quartier vous fait traverser mille ans d'histoire.","funFact":"Le calendrier copte est un héritage direct des pharaons : ses douze mois de trente jours plus cinq jours complémentaires reprennent le calendrier de l'Égypte antique, et certains noms de mois dérivent encore de divinités anciennes comme Hathor (mois de Hathor/Hâtour) ou Thot."},{"id":"egypte-moderne-nasser","title":"L'Égypte moderne : de Bonaparte à aujourd'hui","days":[4],"locations":["Le Caire","Assouan"],"sites":["Haut barrage d'Assouan","Canal de Suez"],"body":"L'Égypte contemporaine naît d'un choc : l'**expédition de Bonaparte** (1798-1801). Militairement, c'est un échec ; culturellement, une révolution. Napoléon avait embarqué des dizaines de savants qui inventorièrent le pays et publièrent la monumentale *Description de l'Égypte* : l'Europe découvre l'Égypte pharaonique et l'**égyptomanie** s'empare de l'Occident. La pierre de Rosette, saisie là, mènera au déchiffrement des hiéroglyphes.\n\nDans le sillage du départ français, un officier albanais de l'armée ottomane, **Mohamed Ali**, prend le pouvoir en 1805 et se taille une Égypte quasi indépendante. Considéré comme le fondateur de l'Égypte moderne, il modernise l'armée, l'agriculture (le coton), l'industrie et l'administration. Sa dynastie régnera jusqu'en 1952. Sous ses successeurs est percé, en 1869, le **canal de Suez**, qui relie la Méditerranée à la mer Rouge et fait de l'Égypte un carrefour stratégique mondial — mais aussi une proie : endettée, elle tombe sous la tutelle puis l'occupation **britannique** (1882).\n\nLe tournant décisif est la **révolution de 1952** : un groupe d'« officiers libres » renverse le roi Farouk. Bientôt émerge la figure de **Gamal Abdel Nasser**, qui incarne le nationalisme arabe et le rêve panarabe. En 1956, il **nationalise le canal de Suez**, tenant tête à la France, au Royaume-Uni et à Israël lors d'une crise internationale retentissante. Avec l'aide soviétique, il lance le **haut barrage d'Assouan**, symbole de l'Égypte souveraine et moderne.\n\nAprès Nasser viennent **Sadate** — qui reprend le Sinaï lors de la guerre de 1973 puis signe une paix historique avec Israël en 1979, ce qui lui coûtera la vie —, puis **Moubarak** (renversé par la révolution de 2011, « printemps arabe » de la place Tahrir), et depuis 2014 le président **Al-Sissi**, sous lequel ont été menés les grands chantiers récents : nouvelle capitale administrative, élargissement de Suez et Grand Musée Égyptien.\n\nSur place, le haut barrage et, au Caire, la ville moderne le long du Nil racontent cette Égypte d'aujourd'hui, fière de ses pharaons autant que de son indépendance.","funFact":"Le tube de la chanson populaire et l'obélisque de la Concorde ont un point commun : c'est Mohamed Ali qui, en signe d'amitié, offrit à la France l'obélisque de Louqsor en 1830 — la France « rendit » la politesse avec une horloge pour la citadelle, restée célèbre pour n'avoir jamais donné l'heure."}]},"geography":{"category":"geography","updated":"2026-07-14","overview":"## L'Égypte, un don du Nil\n\nAvec près d'**un million de km²** (le double de la France), l'Égypte est un pays immense mais presque entièrement désertique : **95 % des Égyptiens vivent sur environ 4 % du territoire**, un mince ruban vert et son delta. Toute la géographie du pays se lit à partir d'une seule ligne, le **Nil**, qui traverse le désert du sud au nord sur plus de 1 500 km en territoire égyptien et sans lequel il n'y aurait ici ni champs, ni villes, ni civilisation. L'historien grec Hérodote résumait déjà l'affaire : l'Égypte est « un don du Nil ».\n\n### La vallée et le delta\n\nEn amont du Caire, le fleuve coule au fond d'une **vallée étroite** (souvent 5 à 20 km de large), encaissée entre deux falaises désertiques : c'est la **Haute-Égypte** (au sud, en amont) et la **Moyenne-Égypte**. Au niveau du Caire, la vallée s'ouvre en un vaste éventail, le **delta du Nil** (~22 000 km²), plaine triangulaire ultra-fertile et surpeuplée qui s'étale jusqu'à la Méditerranée entre Alexandrie et Port-Saïd. Vallée et delta forment la **Basse et la Haute-Égypte**, les « Deux Terres » que les pharaons se vantaient d'avoir unifiées.\n\n### Les déserts qui encadrent le fleuve\n\nÀ l'ouest s'étend le **désert Libyque** (ou désert Occidental), immense mer de sable qui prolonge le Sahara ; on y trouve les grandes **oasis** (Siwa, Bahariya, Farafra, Kharga, Dakhla) et la dépression du **Fayoum**. À l'est, entre la vallée et la mer, le **désert Arabique** (désert Oriental) est plus montagneux et rocheux : une chaîne de reliefs granitiques et volcaniques le hérisse, culminant vers 2 000 m, riche en carrières et en mines exploitées depuis l'Antiquité. Au nord-est, au-delà du **canal de Suez**, la **péninsule du Sinaï** fait le pont vers l'Asie et porte le point culminant du pays (mont Sainte-Catherine, 2 629 m).\n\n### La mer Rouge et le grand Sud\n\nÀ l'est, la **mer Rouge** borde l'Égypte sur environ 1 500 km : mer chaude, très salée, presque sans marée, réputée pour ses **récifs coralliens** parmi les plus riches du monde (Hurghada, Marsa Alam). Tout au sud, la **Nubie** a été en partie noyée par le **lac Nasser**, immense réservoir créé par le haut barrage d'Assouan dans les années 1960.\n\n### Où vivent les Égyptiens\n\nLa population — environ **115 millions d'habitants en 2025**, la plus nombreuse du monde arabe — se concentre donc là où il y a de l'eau : le long du Nil, dans le delta et sur les rives du canal de Suez. Le **Grand Caire** dépasse à lui seul **20 millions d'habitants**. Face à cette pression, l'État pousse les Égyptiens vers de **villes nouvelles** gagnées sur le désert, dont une **nouvelle capitale administrative** à l'est du Caire. Ce contraste permanent entre le vert et le sable, l'eau et la pierre, structure tout le voyage.","entries":[{"id":"nil-fleuve","title":"Le Nil, colonne vertébrale de l'Égypte","days":[3,4,5,6,7],"locations":["Le Caire","Assouan","Kom Ombo","Edfou","Esna","Louxor"],"body":"Le **Nil** est le fil conducteur de tout le circuit : c'est sur ses eaux que se déroule la croisière d'Assouan à Louxor. Long d'environ **6 650 km** (l'un des plus longs fleuves du monde), il naît de deux branches. Le **Nil Blanc**, régulier, part de la région du lac Victoria (Ouganda) ; le **Nil Bleu**, torrentueux, descend du lac Tana en Éthiopie. Les deux se rejoignent à **Khartoum** (Soudan) puis le fleuve traverse le désert nubien jusqu'en Égypte. C'est le Nil Bleu qui, gonflé par les pluies de mousson d'été sur les hauts plateaux éthiopiens, apportait l'essentiel de l'eau et du limon.\n\nPendant des millénaires, la **crue annuelle** (de juillet à octobre) débordait la vallée, déposait un limon noir très fertile — d'où le nom antique du pays, *Kemet*, « la Terre noire » — et rythmait l'agriculture et le calendrier. Trop faible, elle annonçait la famine ; trop forte, elle emportait les villages.\n\nDepuis la mise en service du **haut barrage d'Assouan** (1970), cette crue naturelle a disparu : le fleuve est aujourd'hui **régulé** toute l'année, ce qui a permis l'irrigation permanente et deux à trois récoltes annuelles, mais prive les champs du limon (remplacé par des engrais) et fait reculer le delta. Sous Assouan, le débit moyen tourne autour de **2 800 m³/s**. Depuis le pont du bateau, on mesure à quel point la vie s'accroche aux rives : palmeraies, champs de canne, villages de brique crue, puis, brutalement, le désert.","keyNumbers":[{"label":"Longueur","value":"≈ 6 650 km (dont plus de 1 500 km en Égypte)"},{"label":"Débit moyen","value":"≈ 2 830 m³/s"},{"label":"Sources","value":"Nil Blanc (lac Victoria) + Nil Bleu (lac Tana, Éthiopie)"},{"label":"Confluent","value":"Khartoum (Soudan)"},{"label":"Crue historique","value":"juillet–octobre (supprimée depuis 1970)"}]},{"id":"le-caire-megapole","title":"Le Caire, mégapole et nouvelle capitale","days":[1,2,3],"locations":["Le Caire","Gizeh"],"body":"Le **Caire** (*al-Qāhira*, « la Victorieuse ») est la plus grande ville d'Afrique et du monde arabe. La ville-centre compte une dizaine de millions d'habitants, mais l'agglomération du **Grand Caire** — qui réunit Le Caire, Gizeh et Qalyubia de part et d'autre du Nil — dépasse **20 millions d'habitants**, autour de **22 à 23 millions en 2025**. On y ressent immédiatement la densité : circulation dense, quartiers empilés, minarets à perte de vue.\n\nGéographiquement, Le Caire occupe une position charnière : c'est **là que la vallée du Nil s'ouvre sur le delta**, au contact entre la Haute et la Basse-Égypte. Le fleuve y est large, ponctué d'îles urbanisées (Gezira, Roda). À l'est, la ville bute sur les collines du **Moqattam** (calcaire) qui portent la Citadelle ; à l'ouest, elle s'étale vers le désert et le **plateau de Gizeh**. L'hôtel du circuit (Grand Nile Tower) donne sur le Nil, à ~20 km de l'aéroport et ~40 min des pyramides.\n\nÉtouffée par sa propre croissance, la capitale « déborde » sur le désert : depuis 2015, l'Égypte construit une **nouvelle capitale administrative** à **45 km à l'est**, à mi-chemin de Suez. Prévue pour **6,5 à 7 millions d'habitants** sur **700 km²**, elle abrite déjà ministères, Parlement, quartier d'affaires et la plus haute tour d'Afrique. Rebaptisée « The New Capital » fin 2025, elle pourrait recevoir le nom de **Memphis**, clin d'œil à l'antique capitale toute proche.","keyNumbers":[{"label":"Agglomération (Grand Caire)","value":"≈ 22 millions d'habitants (2025)"},{"label":"Rang","value":"1re ville d'Afrique et du monde arabe"},{"label":"Nouvelle capitale","value":"45 km à l'est, 700 km², 6,5–7 M hab. prévus"},{"label":"Situation","value":"au contact vallée du Nil / delta"}]},{"id":"gizeh-plateau","title":"Le plateau de Gizeh, balcon du désert","days":[2],"locations":["Gizeh","Le Caire"],"body":"Les pyramides de **Gizeh** ne se dressent pas au milieu de nulle part : elles sont bâties sur un **plateau calcaire** qui forme une avancée du **désert Libyque** vers la rive ouest du Nil. Le site se trouve à environ **8 km** du centre de Gizeh et **25 km** du cœur du Caire, dont l'urbanisation a fini par lécher le pied du plateau — au point qu'on voit aujourd'hui la ville d'un côté et le désert de l'autre.\n\nLe plateau s'élève d'une **soixantaine de mètres** au-dessus de la plaine cultivée du Nil, ce qui explique le choix des bâtisseurs : un socle rocheux solide, sec, dominant la vallée et visible de loin. La roche est un **calcaire à nummulites** issu de la formation du Moqattam (éocène), homogène et facile à extraire — les blocs des pyramides ont en partie été taillés sur place, tandis que le granite rose des chambres venait d'Assouan, à 900 km au sud.\n\nLe **Sphinx** lui-même a été sculpté directement dans un **éperon calcaire** du plateau, dans une ancienne carrière. Le fait que les pharaons aient installé leur nécropole sur la **rive ouest**, côté couchant, n'est pas un hasard : l'ouest est la direction du soleil qui meurt, donc du royaume des morts. Depuis le plateau, le regard embrasse d'un côté la mégapole verte et grise, de l'autre l'étendue ocre du désert qui court jusqu'au Sahara.","keyNumbers":[{"label":"Altitude au-dessus de la plaine","value":"≈ 60 m"},{"label":"Distance au centre du Caire","value":"≈ 25 km"},{"label":"Nature du sol","value":"plateau calcaire (désert Libyque)"},{"label":"Rive","value":"rive ouest du Nil (côté couchant)"}]},{"id":"moyenne-haute-egypte","title":"La vallée traversée : Moyenne et Haute-Égypte","days":[3],"locations":["Le Caire","Assouan"],"body":"Le vol Le Caire → Assouan (jour 3) survole d'un trait toute la **vallée du Nil**, du delta au grand Sud. C'est l'occasion de comprendre l'organisation du pays. On distingue traditionnellement la **Basse-Égypte** (le delta et Le Caire, au nord, en *aval*), la **Moyenne-Égypte** (de Beni Souef à Assiout) et la **Haute-Égypte** (d'Assiout à Assouan, au sud, en *amont*). Attention au vocabulaire, contre-intuitif : la Haute-Égypte est au **sud** car elle est en amont, plus « haut » sur le cours du fleuve.\n\nEntre Le Caire et Assouan, le paysage est d'une constance frappante : une **vallée étroite**, large de quelques kilomètres seulement, où alternent champs de canne à sucre, palmeraies et villages de brique crue, prise en étau entre deux **falaises désertiques**. À l'ouest le désert Libyque, à l'est le désert Arabique montagneux. La ligne de contact entre le vert et le sable est souvent nette au point qu'on peut avoir un pied dans le champ et l'autre dans le désert.\n\nC'est cette vallée qui concentre l'essentiel des grands sites du voyage : Assouan, Kom Ombo, Edfou, Esna, Louxor s'égrènent tous le long du fleuve, comme des perles sur un fil. Historiquement, cette Haute-Égypte agricole et conservatrice fut le berceau de l'unification du pays et le cœur religieux de l'Égypte antique, avec Thèbes (Louxor) pour capitale du Nouvel Empire.","keyNumbers":[{"label":"Distance Le Caire–Assouan","value":"≈ 840 km à vol d'oiseau"},{"label":"Largeur de la vallée cultivée","value":"souvent 5 à 20 km"},{"label":"Repère","value":"Haute-Égypte = sud = amont"},{"label":"Encadrement","value":"désert Libyque (ouest) / Arabique (est)"}]},{"id":"assouan-premiere-cataracte","title":"Assouan et la première cataracte","days":[3,4,5],"locations":["Assouan"],"body":"**Assouan** (*Aswān*) est la ville la plus au sud de l'Égypte utile, à environ **840 km** du Caire et **200–220 km** en amont de Louxor. Avec près de **300 000 habitants**, c'est une ville détendue, plus africaine et nubienne que les autres étapes, réputée pour son climat très sec et ensoleillé.\n\nSa position tient à un accident géologique majeur : la **première cataracte**. Ici, le lit du Nil rencontre un seuil de **granite rose** très dur qui affleure et fragmente le fleuve en une multitude de bras, d'îlots et de rapides. Pendant des millénaires, cette cataracte a formé la **frontière naturelle sud** de l'Égypte, verrou vers la Nubie : au-delà commençait un autre monde. Le nom antique de la région, *Souenet*, a donné « Syène », le comptoir-frontière et centre de commerce des caravanes.\n\nCe granite fait aussi la richesse d'Assouan : les célèbres **carrières** ont fourni obélisques, colosses et sarcophages à toute l'Égypte, dont l'**obélisque inachevé** (près de 42 m) toujours couché dans la roche. Au fil de l'eau, le paysage devient minéral et somptueux : rochers noirs polis, dunes dorées de la rive ouest tombant droit dans le fleuve, felouques à voile latine. C'est aussi à Assouan que se trouvent les deux barrages (l'ancien de 1902 et le haut barrage de 1970) qui ont fait de la ville la clé hydraulique du pays.","keyNumbers":[{"label":"Population","value":"≈ 290 000 habitants"},{"label":"Distance au Caire","value":"≈ 840 km au sud"},{"label":"Distance à Louxor","value":"≈ 200–220 km (par le fleuve)"},{"label":"Particularité","value":"1re cataracte, seuil de granite, frontière antique"},{"label":"Obélisque inachevé","value":"41,75 m dans la carrière"}]},{"id":"lac-nasser-haut-barrage","title":"Le haut barrage et le lac Nasser","days":[4],"locations":["Assouan"],"body":"Le **haut barrage d'Assouan** (*Sadd el-Aali*), inauguré en **1970** après dix ans de travaux avec l'aide soviétique, est l'ouvrage qui a transformé la géographie de l'Égypte moderne. Ce n'est pas un mur mince mais une **digue de remblai colossale** : **3 600 m de long**, environ **111 m de haut** et près d'**un kilomètre d'épaisseur à la base**, soit un volume de matériaux dix-sept fois supérieur à celui de la grande pyramide.\n\nSon rôle : **maîtriser la crue du Nil**, produire de l'électricité (sa centrale a longtemps fourni une bonne part du courant du pays) et garantir l'irrigation toute l'année. En retenant le fleuve, il a créé l'un des plus grands **lacs artificiels du monde**, le **lac Nasser**, qui s'étire sur **environ 500 km** vers le sud (dont une centaine en territoire soudanais, où il porte le nom de lac Nubie), sur **10 km de large** en moyenne et jusqu'à 6 000–6 500 km² de superficie. Sa capacité de stockage atteint **près de 160 milliards de m³**.\n\nCe progrès a eu un coût lourd : la **Nubie** ancestrale a été engloutie, des dizaines de milliers de Nubiens déplacés, et de nombreux temples (dont **Abou Simbel** et **Philae**) ont dû être sauvés des eaux. Le limon fertilisant reste désormais piégé au fond du lac, obligeant à recourir aux engrais, et le delta, privé d'apports, recule face à la mer. Depuis le sommet du barrage, la vue embrasse d'un côté le fleuve maîtrisé, de l'autre l'immensité bleue du lac dans le désert.","keyNumbers":[{"label":"Mise en service","value":"1970"},{"label":"Dimensions du barrage","value":"3 600 m de long, ~111 m de haut"},{"label":"Lac Nasser — longueur","value":"≈ 500 km (jusqu'au Soudan)"},{"label":"Lac Nasser — capacité","value":"≈ 160 milliards de m³"},{"label":"Superficie du lac","value":"≈ 6 000 km²"}]},{"id":"iles-du-nil","title":"Les îles d'Assouan : Éléphantine, Philae, Agilkia","days":[4],"locations":["Assouan","Île de Philae","Île Éléphantine"],"body":"Devant Assouan, le Nil freiné par la cataracte se sème d'**îles** que l'on rejoint en felouque : Éléphantine, Kitchener (l'île aux plantes), Séhel, Agilkia. Ces îles rocheuses, coiffées de verdure et cernées de blocs de granite, offrent parmi les plus belles approches fluviales du voyage.\n\nL'**île Éléphantine** (*Abou*, « l'éléphant », sans doute d'après ses rochers ou le commerce de l'ivoire) fut le poste-frontière et le port de commerce vers la Nubie, ainsi qu'un centre religieux dédié à Khnoum, dieu de la crue. On y voit un célèbre **nilomètre** : un escalier de 90 marches descendant dans le fleuve, gradué pour **mesurer la hauteur de la crue**. De ce niveau dépendaient les récoltes attendues et le montant de l'impôt — un instrument à la fois scientifique et fiscal.\n\nLe temple d'**Isis de Philae** offre le cas d'école du sauvetage patrimonial. Son île d'origine ayant été noyée par les barrages, l'ensemble a été **démonté pierre par pierre (plus de 300 000 blocs) dans les années 1970** et remonté à l'identique sur l'**île voisine d'Agilkia**, quelques centaines de mètres plus loin et une dizaine de mètres plus haut — le terrain d'Agilkia ayant même été retaillé pour ressembler à Philae. On approche le temple par bateau, le voyant surgir peu à peu au milieu des rochers : l'une des plus belles arrivées archéologiques du monde.","keyNumbers":[{"label":"Îles principales","value":"Éléphantine, Kitchener, Séhel, Agilkia"},{"label":"Nilomètre d'Éléphantine","value":"escalier de 90 marches"},{"label":"Déplacement de Philae","value":"années 1970, > 300 000 blocs"},{"label":"Philae → Agilkia","value":"quelques centaines de m, +~13 m d'altitude"}]},{"id":"croisiere-assouan-louxor","title":"La croisière Assouan–Louxor : paysages et rives","days":[5,6],"locations":["Assouan","Kom Ombo","Edfou","Esna","Louxor"],"body":"Le cœur du voyage est la **navigation d'Assouan à Louxor**, environ **200 km vers le nord**, au fil du courant. Comme le Nil coule du sud vers le nord, descendre le fleuve signifie **aller vers le nord** — encore un repère à garder en tête. La croisière s'étire sur plusieurs jours avec des escales : **Kom Ombo**, **Edfou**, **Esna**, puis Louxor.\n\nLe spectacle, c'est la vie des **rives**. Le bateau glisse entre deux liserés de verdure : palmeraies, champs de canne à sucre et de blé, buffles, pêcheurs, enfants qui saluent, villages de brique crue aux minarets blancs. Derrière cette frange fertile, souvent large de quelques centaines de mètres à peine, surgissent aussitôt les **falaises jaunes du désert**, parfois si proches qu'elles semblent tomber dans le fleuve. Au coucher du soleil, les felouques croisent le bateau à contre-jour.\n\nDeux escales illustrent la géographie du fleuve. À **Kom Ombo**, le temple double (Sobek le crocodile et Horus l'ancien) se dresse en surplomb direct sur un méandre — la région était réputée pour ses crocodiles au temps où le fleuve était sauvage. À **Esna**, le bateau franchit une **écluse** : c'est le seul véritable obstacle de navigation entre Assouan et Louxor, un barrage-écluse qui régule le niveau et où les convois patientent parfois plusieurs heures. **Edfou** se rejoint en calèche depuis le quai. Ces étapes rappellent que le Nil est resté, jusqu'à aujourd'hui, la grande **voie de circulation** de la vallée.","keyNumbers":[{"label":"Distance navigée","value":"≈ 200 km (Assouan → Louxor)"},{"label":"Sens","value":"vers le nord (dans le sens du courant)"},{"label":"Escales","value":"Kom Ombo, Edfou, Esna, Louxor"},{"label":"Ouvrage franchi","value":"écluse d'Esna"}]},{"id":"louxor-thebes","title":"Louxor / Thèbes : rive Est des vivants, rive Ouest des morts","days":[6,7],"locations":["Louxor (Thèbes)"],"body":"**Louxor**, l'antique **Thèbes**, s'étend à **700 km au sud du Caire**, sur les deux berges du Nil. Ville d'environ **285 000 habitants**, elle est souvent surnommée « le plus grand musée à ciel ouvert du monde », tant les monuments y sont denses. Sa géographie est structurée par une idée simple et forte : le **fleuve sépare le monde des vivants de celui des morts**.\n\nSur la **rive Est**, celle du soleil levant, s'étendait la **ville des vivants** : c'est là que se dressent les grands temples de culte, **Karnak** et **Louxor**, autrefois reliés par une allée de sphinx (le *dromos*) de près de 3 km. C'est aujourd'hui encore le centre urbain, avec la corniche, les hôtels et les marchés.\n\nSur la **rive Ouest**, celle du soleil couchant, s'étend la **nécropole**, le royaume des morts. Adossée aux falaises désertiques dominées par la « Cime » (el-Qurn, pyramide naturelle), elle abrite la **Vallée des Rois**, la **Vallée des Reines**, les temples funéraires (Deir el-Bahari, temple d'Hatchepsout) et les **Colosses de Memnon**. On traverse le fleuve pour passer d'un monde à l'autre, exactement comme le faisaient les cortèges funéraires antiques. Entre les deux, la mince bande cultivée sépare nettement les temples de la lisière du désert, où commencent les tombeaux — une lecture géographique du sacré qui saute aux yeux depuis n'importe quel point élevé.","keyNumbers":[{"label":"Population","value":"≈ 285 000 habitants"},{"label":"Distance au Caire","value":"≈ 700 km au sud"},{"label":"Rive Est","value":"temples des vivants (Karnak, Louxor)"},{"label":"Rive Ouest","value":"nécropole (Vallée des Rois et des Reines)"},{"label":"Étendue de Thèbes","value":"≈ 93 km² sur les deux rives"}]},{"id":"abou-simbel-nubie","title":"Abou Simbel et la Nubie engloutie","days":[5],"locations":["Abou Simbel","Assouan"],"body":"L'excursion facultative d'**Abou Simbel** mène tout au sud de l'Égypte, à **environ 280 km d'Assouan** et à une quarantaine de kilomètres seulement de la frontière soudanaise, au bord du **lac Nasser**. On y accède par la route (près de 3 h à travers le désert, souvent en convoi) ou par un vol court. C'est l'occasion de mesurer l'immensité du désert Occidental et l'étendue du lac artificiel.\n\nLe site raconte à lui seul le grand bouleversement géographique du XXe siècle. Les deux temples de **Ramsès II** et de son épouse **Néfertari**, taillés dans la falaise vers -1260, se dressaient à l'origine au ras du fleuve, en pleine **Nubie**. La création du lac Nasser condamnait à les noyer. De **1964 à 1968**, dans le cadre d'une **campagne internationale de l'UNESCO** (une cinquantaine de pays), les temples ont été **sciés en plus de 1 000 blocs de 20 à 30 tonnes**, remontés **65 m plus haut et 200 m en retrait**, et reconstitués à l'identique, adossés à une colline artificielle en béton. L'orientation du grand temple a été respectée au point que le soleil illumine toujours le fond du sanctuaire deux fois par an.\n\nCette opération, avec le sauvetage parallèle de Philae, a marqué la naissance de la notion moderne de **patrimoine mondial de l'humanité**. Autour, l'ancienne Nubie a disparu sous les eaux : ses villages, ses palmeraies et une bonne partie de son histoire reposent désormais au fond du lac.","keyNumbers":[{"label":"Distance à Assouan","value":"≈ 280 km au sud"},{"label":"Sauvetage","value":"1964–1968, campagne UNESCO"},{"label":"Déplacement","value":"+65 m en hauteur, 200 m en retrait"},{"label":"Découpe","value":"> 1 000 blocs de 20 à 30 tonnes"},{"label":"Situation","value":"bord du lac Nasser, près du Soudan"}]},{"id":"desert-arabique","title":"Le désert Arabique, de Louxor à la mer Rouge","days":[8],"locations":["Louxor","Marsa Alam"],"body":"Le transfert de **Louxor à Marsa Alam** (jour 8) fait basculer le voyage d'un univers à l'autre : on quitte la vallée du Nil pour traverser tout le **désert Arabique** (ou désert Oriental) jusqu'à la mer Rouge, sur environ **300–350 km** et 4 à 5 heures de route.\n\nContrairement au désert Libyque, plat et sableux, le désert Arabique est **montagneux et rocheux**. Une véritable chaîne de reliefs, les **Red Sea Hills**, court parallèlement à la côte : massifs de granite, de roches volcaniques et métamorphiques, sommets dépassant 2 000 m (Gebel Shayeb el-Banat, ~2 187 m, point culminant de l'Égypte continentale). Entre ces montagnes serpentent des **wadis**, vallées sèches qui ne coulent qu'aux rares orages, jalonnées d'acacias et parcourues par les Bédouins *Ababda*.\n\nCe désert a toujours été une **zone de ressources** : les Égyptiens y exploitaient l'or (d'où le nom antique de la région, *Ta-Nétjer* ou les mines du Ouadi Hammamat), le granite, le porphyre et les pierres semi-précieuses ; les Romains y ouvrirent des routes vers leurs ports de la mer Rouge. Aujourd'hui encore, la route moderne suit d'anciens itinéraires caravaniers reliant la vallée à la côte. Le paysage, d'abord monotone, se révèle grandiose : plaines caillouteuses ocre, montagnes bleutées à l'horizon, puis, soudain, l'apparition de la mer Rouge d'un bleu intense au débouché des reliefs.","keyNumbers":[{"label":"Distance Louxor–Marsa Alam","value":"≈ 300–350 km (4–5 h de route)"},{"label":"Point culminant (Égypte continentale)","value":"Gebel Shayeb el-Banat, ~2 187 m"},{"label":"Relief","value":"montagnes granitiques et volcaniques (Red Sea Hills)"},{"label":"Ressources antiques","value":"or, granite, porphyre, pierres précieuses"}]},{"id":"mer-rouge-marsa-alam","title":"La mer Rouge et les récifs de Marsa Alam","days":[8,9,10,11,12,13,14],"locations":["Marsa Alam","Hurghada"],"body":"Le séjour balnéaire se déroule à **Marsa Alam**, sur la côte sud-égyptienne de la **mer Rouge**. Cette mer étroite et allongée (~1 900 km de long) occupe un **fossé d'effondrement tectonique** : c'est ici que la plaque africaine et la plaque arabique s'écartent lentement, ouvrant peu à peu un futur océan. D'où sa grande profondeur (plus de 2 000 m par endroits) au ras d'un rivage désertique.\n\nSes caractéristiques en font un paradis sous-marin. Presque **fermée**, très peu alimentée en eau douce (aucun fleuve, quasi pas de pluie) et soumise à une forte évaporation, la mer Rouge est **chaude** (22–30 °C) et **très salée**. Son eau limpide, pauvre en nutriments mais gorgée de lumière, est idéale pour les **coraux** : le nord de la mer Rouge abrite l'un des **écosystèmes coralliens les plus riches et les plus résistants du monde**, avec des centaines d'espèces de coraux et plus d'un millier d'espèces de poissons.\n\nMarsa Alam, longtemps simple village de pêcheurs et de mineurs, est devenue une station de plongée réputée, plus sauvage que Hurghada (271 km au nord, d'où repart le vol retour). Au large se trouve le célèbre récif d'**Elphinstone**, mur de corail de plus de 400 m fréquenté par les requins ; le long de la côte, les baies (*marsa*) abritent des herbiers où l'on peut observer **tortues** et **dugongs** (« vaches de mer »), ainsi que des raies et des dauphins. Le contraste est saisissant : d'un côté le désert le plus aride, de l'autre l'une des mers les plus vivantes de la planète.","keyNumbers":[{"label":"Longueur de la mer Rouge","value":"≈ 1 900 km"},{"label":"Température de l'eau","value":"22–30 °C selon la saison"},{"label":"Origine","value":"fossé tectonique (Afrique / Arabie qui s'écartent)"},{"label":"Récif emblématique","value":"Elphinstone (> 400 m de long)"},{"label":"Distance Marsa Alam–Hurghada","value":"≈ 271 km au nord"}]},{"id":"canal-de-suez","title":"Le canal de Suez, verrou entre deux mers","days":[1,15],"locations":["Canal de Suez","Le Caire"],"body":"Bien qu'il ne figure pas parmi les visites, le **canal de Suez** est incontournable pour comprendre l'Égypte : c'est l'un des points de passage les plus stratégiques du commerce mondial et une ressource économique majeure du pays. Ouvert en **1869** (percé sous la direction de Ferdinand de Lesseps), il relie la **Méditerranée** (Port-Saïd) à la **mer Rouge** (Suez) en traversant l'isthme de Suez, épargnant aux navires le tour de l'Afrique.\n\nSa géographie est remarquable : c'est le **plus long canal maritime sans écluse du monde**, environ **193 km**, avec une largeur de 280 à 345 m et une profondeur de plus de 22 m. Il n'a pas besoin d'écluses car la Méditerranée et la mer Rouge sont pratiquement au même niveau. Il s'appuie sur des **lacs naturels** (les lacs Amers) et une ville-relais, **Ismaïlia**, sur ses rives. Un **doublement partiel** a été inauguré en 2015 puis prolongé fin 2024, portant à ~82 km la section à deux voies pour fluidifier le trafic.\n\nLe canal marque aussi la **limite géographique entre l'Afrique et l'Asie** : à l'est s'ouvre le **Sinaï**, seule partie asiatique de l'Égypte. Économiquement, il représente en temps normal plusieurs milliards de dollars de recettes annuelles, mais la **crise de la mer Rouge** (attaques houthies) a fait chuter le trafic de moitié en 2024–2025, coûtant au pays une bonne partie de ces revenus — un rappel que cette géographie de passage est aussi une vulnérabilité.","keyNumbers":[{"label":"Longueur","value":"≈ 193 km"},{"label":"Ouverture","value":"1869 (sans écluse)"},{"label":"Profondeur","value":"> 22 m"},{"label":"Rôle","value":"Méditerranée ⇄ mer Rouge ; limite Afrique/Asie"},{"label":"Contexte 2024–2025","value":"trafic ≈ –50 % (crise de la mer Rouge)"}]},{"id":"fayoum-oasis","title":"Le Fayoum et les oasis du désert","days":[2],"locations":["Le Caire"],"body":"À une centaine de kilomètres au sud-ouest du Caire s'ouvre le **Fayoum**, la plus vaste et la plus originale des oasis d'Égypte. Ce n'est pas une oasis classique isolée dans les sables, mais une immense **dépression** du désert Libyque (jusqu'à ~40 m sous le niveau de la mer), d'environ **18 000 km²**, rattachée au Nil par un bras naturel puis canalisé, le **Bahr Youssef**. Cette eau en fait un jardin verdoyant en plein désert, réputé pour ses vergers, ses roses et ses champs — les Anciens l'appelaient déjà « le jardin de l'Égypte ».\n\nAu fond de la cuvette s'étale le **lac Qaroun** (l'antique lac Moéris), à 40 m sous le niveau marin, vestige d'un lac autrefois bien plus vaste que les pharaons du Moyen Empire régulaient déjà pour stocker les eaux de crue. C'est aujourd'hui un site majeur pour les **oiseaux migrateurs** et un lieu de fossiles marins spectaculaires (la « Vallée des Baleines », Wadi el-Hitan, classée à l'UNESCO).\n\nLe Fayoum illustre l'autre géographie de l'Égypte, celle des **oasis**. Au-delà de la vallée du Nil, le désert Occidental abrite un chapelet de dépressions habitées, alimentées par des **nappes souterraines** : Siwa (près de la Libye, célèbre pour son oracle et ses dattes), Bahariya, Farafra, Dakhla et Kharga. Longtemps mondes à part, reliés par les caravanes, ces oasis sont aujourd'hui des cibles des projets d'irrigation et de mise en valeur agricole (Toshka, « nouvelle vallée ») par lesquels l'Égypte tente de gagner des terres sur le désert.","keyNumbers":[{"label":"Superficie de la dépression","value":"≈ 18 000 km²"},{"label":"Altitude du lac Qaroun","value":"≈ –40 m (sous le niveau de la mer)"},{"label":"Distance au Caire","value":"≈ 100 km au sud-ouest"},{"label":"Alimentation","value":"Bahr Youssef (bras dérivé du Nil)"},{"label":"Autres oasis","value":"Siwa, Bahariya, Farafra, Dakhla, Kharga"}]}]},"climate":{"category":"climate","updated":"2026-07-14","overview":"## Le climat de l'Égypte, d'hier à aujourd'hui\n\nL'Égypte que vous allez traverser est l'un des pays les plus arides de la planète : moins de 20 mm de pluie par an à Assouan, un soleil quasi permanent, un désert qui couvre 95 % du territoire. Mais ce paysage minéral n'a pas toujours existé, et il est en train de changer une nouvelle fois.\n\n**Le Sahara vert.** Entre environ 11 000 et 5 000 ans avant notre ère, pendant la « Période humide africaine », l'inclinaison de l'axe terrestre poussait les moussons bien plus au nord qu'aujourd'hui. Le Sahara était alors une savane parsemée de lacs, de rivières et de troupeaux. Des populations de chasseurs puis d'éleveurs y vivaient et ont laissé la plus forte densité d'art rupestre au monde — girafes, bovins, nageurs. On a même retrouvé une « grotte des nageurs » dans le désert occidental égyptien.\n\n**L'assèchement et la naissance de l'Égypte.** À partir de 7 000 à 5 000 ans avant notre ère, les moussons reculent, le Sahara se désertifie et se vide de ses habitants. Ces populations refluent vers le seul point d'eau pérenne de la région : le Nil. Cette concentration coïncide avec l'apparition de la vie sédentaire, de l'agriculture irriguée, puis de l'État pharaonique. C'est un paradoxe fondateur : l'assèchement du désert a fait naître la civilisation du Nil.\n\n**La crue annuelle.** Pendant cinq millénaires, l'Égypte a vécu au rythme de la crue estivale du Nil, gonflé par les pluies de mousson sur les hauts plateaux éthiopiens. Chaque été, le fleuve débordait, déposait un limon noir et fertile — le *Kemet*, la « terre noire » qui donna son nom au pays — puis se retirait pour les semailles. Des nilomètres, comme ceux d'Éléphantine (que vous verrez à Assouan) et de Kom Ombo, mesuraient sa hauteur pour prévoir récoltes et impôts.\n\n**La fin des crues.** Ce cycle millénaire s'est arrêté net avec le haut barrage d'Assouan, achevé en 1970. Le barrage a apporté maîtrise de l'eau et électricité, mais a supprimé le limon fertilisant (retenu dans le lac Nasser), obligeant à recourir aux engrais, et a accéléré l'érosion du delta.\n\n**Le réchauffement actuel.** L'Égypte se réchauffe désormais près de deux fois plus vite que la moyenne mondiale (+0,5 °C par décennie). Les canicules se multiplient : Assouan a atteint 50,9 °C en juin 2024, année la plus chaude jamais mesurée dans le monde arabe. Au sud, l'eau se fait rare tandis que l'Éthiopie remplit son grand barrage (GERD) en amont ; au nord, la montée de la mer et l'affaissement du sol menacent le delta, grenier et cœur démographique du pays. La mer Rouge, elle, se réchauffe et met à l'épreuve ses coraux réputés parmi les plus résistants au monde. Le climat reste le grand personnage invisible de tout voyage en Égypte.","entries":[{"id":"sahara-vert-art-rupestre","title":"Le Sahara vert et l'art rupestre","days":[2],"locations":["Le Caire","Désert occidental"],"body":"Il est difficile, en regardant l'océan de sable qui borde les pyramides, d'imaginer que ce désert fut vert. Pourtant, entre environ **11 000 et 5 000 ans avant notre ère**, le Sahara connaissait sa dernière « Période humide africaine ». L'axe de rotation de la Terre était légèrement plus incliné, ce qui décalait la mousson africaine loin vers le nord. Résultat : là où s'étend aujourd'hui le plus grand désert chaud du monde s'ouvraient des savanes, des réseaux de rivières et de vastes lacs, parfois appelés « méga-lacs ».\n\nCe Sahara verdoyant était habité. Des communautés de chasseurs-cueilleurs, puis d'éleveurs de bovins, de moutons et de chèvres, y ont prospéré. Elles nous ont laissé un témoignage exceptionnel : le Sahara possède **la plus forte densité d'art rupestre de la planète**. Gravures (pétroglyphes) et peintures représentent des girafes, des éléphants, des troupeaux, des scènes de chasse — et même des nageurs. La célèbre « grotte des Nageurs » du plateau du Gilf Kébir, dans le désert occidental égyptien, montre des silhouettes qui semblent flotter : preuve qu'il y avait là de l'eau profonde, à des centaines de kilomètres de tout point d'eau actuel.\n\nDes analyses d'ADN ancien confirment qu'une lignée nord-africaine distincte vivait dans ce Sahara vert avant qu'il ne se referme. Comprendre cette période, c'est saisir le décor dans lequel se prépare, à bas bruit, la future civilisation égyptienne : ce ne sont pas des Égyptiens qui vivaient au désert, mais des populations qui, en refluant vers le Nil lors de l'assèchement, formeront le creuset du peuplement de la vallée. Le désert que vous traversez est donc une immense archive climatique."},{"id":"assechement-naissance-civilisation-nil","title":"L'assèchement du Sahara et la naissance de l'Égypte","days":[2],"locations":["Le Caire","Vallée du Nil"],"body":"Le grand paradoxe de l'histoire égyptienne tient en une phrase : **c'est la sécheresse qui a fait naître la civilisation**. Vers 7 000 à 5 000 ans avant notre ère, la Période humide africaine touche à sa fin. La mousson recule vers le sud, les lacs sahariens s'évaporent, les pâturages se transforment en dunes. Ce dessèchement n'est pas brutal partout, mais il est inexorable : les sites néolithiques du Sahara sont progressivement abandonnés.\n\nOù vont ces populations ? Vers le seul point d'eau permanent de toute la région : **le Nil**. Le fleuve, alimenté par les pluies lointaines des hauts plateaux d'Afrique de l'Est, coule toute l'année et déborde chaque été. Sur ses berges, l'eau et le limon rendent l'agriculture possible au milieu d'un désert absolu.\n\nCette concentration démographique le long d'un ruban étroit a des conséquences décisives. La proximité force la coopération : il faut gérer l'eau, creuser des canaux, stocker le grain, répartir les terres après la crue. De cette organisation naissent la vie sédentaire, les premiers villages, puis les royaumes de Haute et Basse-Égypte, enfin l'État pharaonique unifié vers 3100 av. J.-C. L'historien grec Hérodote résumera bien plus tard cette évidence géographique par une formule restée célèbre : l'Égypte est « un don du Nil ».\n\nAutrement dit, sans le changement climatique de la fin du Néolithique, il n'y aurait sans doute jamais eu de pharaons. Le désert qui entoure chaque site que vous visiterez n'est pas seulement un décor : c'est la force qui a poussé les hommes vers le fleuve et scellé le destin de l'Égypte. Le climat est le premier des dieux fondateurs."},{"id":"desert-preservateur-monuments","title":"Pourquoi le désert a préservé les monuments","days":[2,7],"locations":["Gizeh","Louxor (Thèbes)"],"body":"Si l'Égypte nous a légué des trésors aussi complets — momies intactes, peintures aux couleurs vives, papyrus lisibles, statues à peine érodées — c'est en grande partie grâce à son climat. **L'aridité est le meilleur des conservateurs.**\n\nDans un environnement humide, tout se dégrade vite : les bactéries et les champignons prolifèrent, le bois pourrit, les tissus se décomposent, les métaux se corrodent, les pigments s'effacent. Le désert égyptien fait l'inverse. Le manque d'eau bloque l'activité microbienne. L'air sec dessèche les tissus organiques avant qu'ils ne se putréfient — c'est d'ailleurs ce phénomène naturel, observé sur des corps enterrés dans le sable chaud, qui aurait inspiré aux Égyptiens la pratique de la momification artificielle.\n\nLa géographie renforce cette protection. Les Égyptiens ont délibérément installé leurs nécropoles **sur la rive Ouest du Nil, en plein désert**, au-delà des terres cultivées et inondables. La Vallée des Rois, que vous visiterez à Louxor, est une gorge désertique où il ne pleut presque jamais : les tombes creusées dans la roche y sont restées scellées et sèches pendant des millénaires. Les tombes de la vallée fertile, elles, ont beaucoup plus souffert de l'humidité et des crues.\n\nCe qui menace aujourd'hui ce miracle de conservation, ce n'est pas le désert mais l'homme et l'eau. La remontée des nappes phréatiques liée à l'irrigation permanente (depuis la fin des crues) fait remonter des sels dans la pierre des temples de Karnak et de Louxor : en cristallisant, ces sels font éclater le grès de l'intérieur. Le tourisme de masse ajoute de l'humidité (la respiration de milliers de visiteurs) dans des tombes conçues pour rester hermétiques. Le climat sec qui a tout sauvé est désormais concurrencé par une humidité d'origine humaine."},{"id":"crue-du-nil-nilometres","title":"La crue du Nil et les nilomètres","days":[4,5],"locations":["Assouan","Île Éléphantine","Kom Ombo"],"body":"Pendant cinq mille ans, toute l'Égypte a retenu son souffle chaque été en attendant **la crue du Nil**. Le mécanisme est purement climatique et lointain : de juin à septembre, la mousson déverse des pluies torrentielles sur les hauts plateaux d'Éthiopie. Ces eaux gonflent le Nil Bleu et l'Atbara, qui rejoignent le Nil Blanc et font monter le fleuve en Égypte à partir de juillet. Le pic était atteint en août-septembre : le Nil débordait sur des kilomètres, noyait les terres, puis se retirait en octobre en déposant une couche de **limon noir, fertile**, prêt pour les semailles.\n\nToute la vie dépendait de la hauteur de cette crue. Trop faible, c'était la famine ; trop forte, elle emportait villages et digues. Les Égyptiens ont donc construit des instruments de mesure : les **nilomètres**. Un nilomètre est un escalier ou un puits gradué descendant jusqu'au fleuve, où l'on lisait le niveau de l'eau sur des repères. La mesure servait à prévoir les récoltes et, très concrètement, à fixer le montant des impôts de l'année.\n\nDeux de ces nilomètres se trouvent précisément sur votre itinéraire. Sur **l'île Éléphantine à Assouan** (que vous longerez en felouque), le nilomètre est l'un des plus anciens et des mieux conservés : un long escalier de pierre gravé de graduations en descend vers le Nil. À **Kom Ombo**, le temple possède également son nilomètre, un puits circulaire relié au fleuve. Guettez-les : ce sont des objets rares qui matérialisent, mieux que tout, le lien vital entre les Égyptiens et leur climat.\n\nCette crue annuelle a cessé d'exister en 1970, avec le haut barrage d'Assouan. Les nilomètres sont donc devenus des vestiges : ils mesurent une réalité disparue."},{"id":"haut-barrage-fin-des-crues","title":"Le haut barrage d'Assouan et la fin des crues","days":[4],"locations":["Assouan"],"body":"Le **haut barrage d'Assouan** (Sadd el-Ali), que vous visiterez, est l'un des ouvrages qui ont le plus changé l'Égypte. Construit de 1960 à 1970 avec l'aide soviétique, ce colosse de terre et de roche haut de 111 m a créé en amont le **lac Nasser**, l'un des plus grands réservoirs artificiels du monde (500 km de long). Son but : dompter enfin le Nil.\n\nLes bénéfices ont été immenses. Le barrage a mis fin aux crues destructrices comme aux étiages meurtriers : l'Égypte dispose désormais d'une réserve d'eau qui la protège des sécheresses pluriannuelles. Il fournit une part importante de l'électricité du pays et permet l'irrigation permanente, avec plusieurs récoltes par an au lieu d'une seule.\n\nMais le prix a été lourd, et il est d'abord climatique et écologique. En bloquant le fleuve, le barrage **retient le limon** qui fertilisait naturellement les champs : ce sédiment s'accumule au fond du lac Nasser au lieu de se déposer sur les terres, obligeant les paysans à recourir massivement aux engrais chimiques. Privé de ses sédiments, le **delta du Nil n'est plus rechargé** et recule sous l'assaut de la mer. L'irrigation permanente, sans le rinçage annuel de la crue, provoque la **salinisation des sols** et la remontée de nappes qui rongent les monuments. Enfin, l'évaporation intense sur l'immense surface du lac Nasser fait perdre chaque année des milliards de mètres cubes d'eau sous le soleil.\n\nLe barrage a aussi eu un coût humain et patrimonial : la montée des eaux a noyé la Nubie ancienne et forcé le déplacement de dizaines de milliers de Nubiens, ainsi que le **sauvetage spectaculaire des temples d'Abou Simbel** (excursion possible au jour 5), démontés et remontés 65 m plus haut. En regardant le barrage, vous contemplez la décision qui a rompu un cycle climatique de cinq millénaires."},{"id":"gerd-tensions-eau-nil","title":"Le GERD et les tensions sur l'eau du Nil","days":[4],"locations":["Assouan"],"body":"L'eau que vous voyez couler à Assouan est aujourd'hui au cœur d'un bras de fer régional. En amont, sur le Nil Bleu, l'Éthiopie a construit le **Grand barrage de la Renaissance éthiopien (GERD)**, le plus grand barrage hydroélectrique d'Afrique. Son réservoir a été rempli par étapes entre 2020 et 2024, et l'Éthiopie a **inauguré officiellement l'ouvrage le 9 septembre 2025**, sans qu'aucun accord n'ait été trouvé avec les pays d'aval.\n\nL'enjeu est vital pour l'Égypte. Le Nil fournit **environ 97 % de son eau douce renouvelable**, dans un pays presque sans pluie et dont la population dépasse 110 millions d'habitants. Le Caire redoute qu'un remplissage ou une exploitation trop rapides du GERD, surtout en période de sécheresse, ne réduisent le débit arrivant au lac Nasser et n'assèchent une partie de ses terres. L'Égypte qualifie le Nil de « question d'existence, non négociable ».\n\nL'Éthiopie, de son côté, présente le barrage comme indispensable à son développement : il doit fournir de l'électricité à des dizaines de millions d'Éthiopiens qui en sont privés. Elle souligne que l'ouvrage est situé sur son territoire, financé par ses propres moyens, et affirme qu'il ne cause pas de préjudice majeur à l'aval.\n\nLes années 2024-2025 ont montré que le risque n'est pas seulement la pénurie : à l'automne 2025, des **lâchers d'eau importants** depuis le GERD ont contribué, avec une crue exceptionnelle, à inonder des terres en Égypte et au Soudan, ravivant les tensions. Sans coordination, un même barrage peut donc provoquer tantôt le manque, tantôt le trop-plein.\n\nPour le voyageur, ce dossier n'a rien d'abstrait : il explique la sensibilité de l'Égypte autour de son fleuve, la priorité nationale donnée à l'eau, et les grands chantiers d'économie hydrique (dessalement, réutilisation des eaux, cultures moins gourmandes) que le pays met en place. Le Nil reste le nerf de la géopolitique régionale."},{"id":"rechauffement-egypte-canicules","title":"Le réchauffement en Égypte aujourd'hui","days":[2],"locations":["Le Caire","Assouan"],"body":"L'Égypte n'est pas épargnée par le réchauffement climatique : elle se situe même dans une région qui chauffe **près de deux fois plus vite que la moyenne mondiale**. Le pourtour de la Méditerranée orientale et le Moyen-Orient figurent parmi les zones les plus exposées de la planète. Sur les dernières décennies, l'Égypte a déjà enregistré une hausse d'environ **0,5 °C par décennie**.\n\nLes records tombent. **2024 a été l'année la plus chaude jamais mesurée dans le monde arabe.** Le 7 juin 2024, Assouan a atteint **50,9 °C à l'ombre**, un record absolu pour la ville. Les étés suivants ont confirmé la tendance : à l'été 2025, l'Égypte a connu des canicules exceptionnelles, avec des pics de 40 à 44 °C dans le Sud, 37-38 °C au Caire et une chaleur humide pénible sur les côtes. Les autorités multiplient désormais les alertes sanitaires et appellent la population à limiter les efforts aux heures chaudes.\n\nCes chaleurs extrêmes ne sont pas qu'une gêne pour les touristes. Elles pèsent sur la **santé publique** (coups de chaleur, mortalité accrue chez les personnes âgées), sur **l'agriculture** (stress des cultures, besoins d'irrigation en hausse) et sur la **consommation d'électricité** (climatisation), dans un pays déjà tendu sur l'énergie et l'eau. Les projections pour le milieu du XXIe siècle annoncent un réchauffement supplémentaire de 1,5 à 3 °C, plus marqué encore à l'intérieur des terres.\n\nConcrètement, pour votre voyage : la Haute-Égypte (Assouan, Louxor) est la région la plus exposée aux fortes chaleurs, surtout de mai à septembre. Les excursions y sont organisées tôt le matin pour cette raison. Le réchauffement rend d'autant plus indispensables les précautions élémentaires — hydratation, ombre, protection solaire — abordées dans la fiche « Conseils face à la chaleur »."},{"id":"delta-du-nil-menace","title":"Le delta du Nil menacé par la mer","days":[],"locations":["Le Caire","Delta du Nil"],"body":"À l'extrémité nord du pays, là où le Nil se jette dans la Méditerranée, s'étend **le delta** : une immense plaine triangulaire, plate et basse, qui concentre **environ la moitié de la population égyptienne** et l'essentiel des terres agricoles les plus fertiles. Cette région est l'une des plus vulnérables au changement climatique au monde, et elle est prise en tenaille par plusieurs menaces à la fois.\n\nLa première est la **montée du niveau de la mer**. Combinée à l'affaissement du sol (voir plus bas), elle produit une hausse relative du niveau marin estimée entre **3,2 et 6,6 mm par an** sur le littoral du delta. À ce rythme, la mer grignote les côtes et pourrait, avec une élévation d'un mètre, submerger une part significative du delta.\n\nLa deuxième est **l'affaissement du sol (subsidence)**. Le delta s'enfonce naturellement à mesure que ses sédiments se tassent — de 0,4 mm/an à l'ouest jusqu'à 3,4 mm/an à l'est. Or, depuis le haut barrage d'Assouan, **le Nil n'apporte plus de limon** pour recharger cette plaine : privé de sédiments, le delta s'enfonce sans se reconstituer.\n\nLa troisième est **l'intrusion d'eau salée**. À mesure que la mer avance et que le sol s'abaisse, l'eau salée pénètre dans les nappes et les canaux. Une élévation d'un mètre pourrait contaminer plus d'un tiers de la réserve d'eau douce du delta. Le sel tue déjà des palmiers et des arbres fruitiers dans la région de Rosette.\n\nLe delta ne figure pas sur votre itinéraire (vous restez au Caire, à sa pointe sud), mais son sort conditionne tout le pays : c'est là que se joue la sécurité alimentaire de l'Égypte. Perdre le delta, ce serait perdre le grenier et le cœur démographique de la nation."},{"id":"microclimats-egypte","title":"Trois climats en un voyage : Caire, Haute-Égypte, mer Rouge","days":[],"locations":["Le Caire","Assouan","Louxor (Thèbes)","Marsa Alam"],"body":"Votre circuit traverse trois ambiances climatiques nettement différentes. Les connaître aide à préparer sa valise et à ajuster son rythme.\n\n**Le Caire et le nord (climat désertique tempéré par la Méditerranée).** À la charnière entre le delta et le désert, Le Caire bénéficie d'un léger adoucissement méditerranéen. Les étés y sont chauds (35 °C en journée) mais moins extrêmes qu'en Haute-Égypte, les hivers doux (autour de 18-20 °C le jour, frais la nuit). La grande particularité est la **pollution** et parfois la brume urbaine, ainsi que le *khamsin*, un vent de sable chaud qui souffle au printemps (mars-mai). Un peu plus d'humidité que dans le Sud.\n\n**La Haute-Égypte : Assouan et Louxor (désert chaud extrême).** Ici, on entre dans le désert absolu. L'air est **très sec**, le ciel presque toujours dégagé, les écarts jour/nuit importants. L'été est brûlant : 41-42 °C sont courants à Assouan et Louxor de mai à septembre, avec des pointes au-delà de 45 °C. La sécheresse de l'air rend toutefois la chaleur plus supportable qu'une chaleur humide, à condition de bien s'hydrater. L'hiver (décembre-février) y est idéal : journées ensoleillées à 23-25 °C, nuits fraîches. C'est la saison de croisière la plus agréable.\n\n**La côte de la mer Rouge : Marsa Alam (désert côtier).** Le bord de mer tempère les extrêmes : les journées d'été plafonnent souvent autour de 34-36 °C, les nuits restent douces, et une **brise marine** rafraîchit l'air. En hiver, l'eau et l'air restent assez chauds pour la baignade. L'inconvénient : un taux d'humidité plus élevé qu'à l'intérieur, et un soleil très fort réverbéré par la mer.\n\nEn passant d'Assouan à Marsa Alam, vous troquez donc une fournaise sèche contre une chaleur côtière plus douce mais plus humide. Prévoyez des vêtements pour les deux registres, plus une petite laine pour les soirées et la climatisation."},{"id":"mer-rouge-eau-coraux","title":"La mer Rouge : eau chaude et coraux à l'épreuve","days":[8,9,10,11,12,13,14],"locations":["Marsa Alam"],"body":"La mer Rouge est l'un des plus beaux terrains de plongée et de snorkeling du monde, et vous aurez sept nuits à Marsa Alam pour en profiter. Deux singularités climatiques la rendent exceptionnelle — et fragile.\n\n**Une mer chaude et salée toute l'année.** Fermée au sud par un détroit étroit et bordée de déserts, la mer Rouge s'évapore intensément : elle est plus **chaude et plus salée** que la moyenne des océans. À Marsa Alam, la température de l'eau ne descend guère sous **22-24 °C en hiver** (janvier-février) et grimpe jusqu'à **29-30 °C en été** (août). On s'y baigne donc douze mois sur douze. Les meilleures fenêtres pour le snorkeling — mer calme, excellente visibilité, eau chaude sans combinaison — sont **avril-juin et septembre-novembre**.\n\n**Des coraux réputés parmi les plus résistants au monde.** Les coraux de la mer Rouge, notamment ceux du nord et du golfe d'Aqaba, tolèrent des températures qui décoloreraient (« blanchiraient ») la plupart des récifs tropicaux ailleurs. Cette résistance thermique en fait un des derniers refuges possibles des coraux face au réchauffement.\n\n**Mais résistants ne veut pas dire invulnérables.** L'été 2024 a apporté un stress thermique record : au sud, **les récifs autour et au sud de Marsa Alam ont connu un blanchissement sévère**, tandis que le nord était plus épargné. Bonne nouvelle : une grande partie des coraux a récupéré en quelques mois lorsque l'eau s'est rafraîchie — on a mesuré jusqu'à 85 % de rétablissement, et les récifs du nord étaient largement remis dès septembre 2025. La fenêtre de récupération se réduit toutefois à mesure que la température de base monte.\n\nCôté voyageur : profitez des récifs de façon responsable. **Ne touchez jamais le corail, ne marchez pas dessus, ne prélevez rien, gardez vos distances** (masque, tuba, palmes suffisent), et préférez une crème solaire respectueuse des récifs. Vous nagerez peut-être au-dessus d'un dugong, de tortues et de raies : un écosystème rare qu'il faut aider à traverser le réchauffement."},{"id":"stress-hydrique-egypte","title":"Un pays sous stress hydrique","days":[],"locations":["Le Caire","Assouan"],"body":"Derrière la carte postale du Nil se cache une réalité tendue : l'Égypte est en situation de **stress hydrique sévère**. Avec plus de 110 millions d'habitants et une croissance démographique soutenue, la part d'eau disponible par personne et par an est tombée bien en dessous du seuil international de « pénurie d'eau ». Le pays vit largement en deçà de ses besoins et importe une grande partie de sa nourriture — donc, indirectement, de « l'eau virtuelle ».\n\nPlusieurs facteurs se conjuguent. D'abord, la **quasi-absence de pluie** : hors mince frange méditerranéenne, il ne tombe presque rien, et l'Égypte dépend à environ 97 % du Nil, un fleuve dont la source est à l'étranger. Ensuite, le **réchauffement** accroît l'évaporation (notamment sur le lac Nasser) et les besoins d'irrigation. Enfin, l'amont se tend avec la mise en service du grand barrage éthiopien (GERD), qui introduit une incertitude sur les débits futurs.\n\nFace à cela, l'Égypte a lancé de vastes politiques d'adaptation : **modernisation de l'irrigation** (abandon progressif de l'irrigation par submersion, très gaspilleuse, au profit du goutte-à-goutte), **réutilisation des eaux usées traitées**, construction d'immenses stations de dessalement sur les côtes, revêtement des canaux pour limiter les fuites, et promotion de cultures moins gourmandes en eau. Le riz, très consommateur, a vu sa culture restreinte par endroits.\n\nPour le voyageur, ce contexte se traduit par quelques gestes simples et appréciés : **économiser l'eau** à l'hôtel (douches courtes, réutilisation des serviettes), ne pas gaspiller, et **éviter de boire l'eau du robinet** — non pour des raisons d'écologie mais de santé (préférez l'eau en bouteille scellée, y compris pour se brosser les dents). Comprendre le stress hydrique aide aussi à mesurer pourquoi le Nil et son eau sont, en Égypte, une affaire aussi sensible que sacrée."},{"id":"conseils-chaleur-voyage","title":"Conseils face à la chaleur en voyage","days":[],"locations":["Le Caire","Assouan","Louxor (Thèbes)","Marsa Alam"],"body":"La chaleur est le principal défi physique d'un voyage en Égypte, surtout en Haute-Égypte de mai à septembre, où l'on dépasse souvent 40 °C. Quelques réflexes permettent d'en profiter sans souffrir.\n\n**Hydratez-vous en continu.** Buvez régulièrement, avant d'avoir soif : 2 à 4 litres d'eau par jour selon l'effort. Emportez toujours une bouteille (eau minérale scellée). Par forte transpiration, compensez aussi les sels minéraux (pastilles d'électrolytes, boissons salées, un peu de sel dans les repas).\n\n**Suivez le rythme du soleil.** Les visites de sites sont programmées **tôt le matin** pour cette raison : levez-vous tôt, profitez de la fraîcheur, et réservez le milieu de journée (12 h-16 h, le plus chaud) pour l'ombre, le bateau ou la sieste. C'est la logique de la croisière et des excursions.\n\n**Couvrez-vous, paradoxalement.** Contre le soleil du désert, mieux vaut des **vêtements amples, légers et clairs, à manches longues**, en coton ou lin, qu'une peau nue. Chapeau à large bord ou casquette, lunettes de soleil, et **crème solaire haute protection** renouvelée souvent. Un foulard léger protège la nuque et peut se mouiller pour rafraîchir.\n\n**Reconnaissez les signes d'alerte.** Maux de tête, vertiges, nausées, crampes, arrêt de la transpiration ou peau brûlante et sèche annoncent l'**insolation ou le coup de chaleur** : mettez-vous à l'ombre, rafraîchissez-vous (eau, linge humide), buvez, et prévenez le guide. Le coup de chaleur est une urgence.\n\n**Cas particuliers.** Les enfants et les personnes âgées sont plus fragiles. En mer Rouge, l'humidité et la brise trompent : on brûle sans sentir la chaleur, et **la réverbération de l'eau intensifie les coups de soleil** — protégez le dos et la nuque en snorkeling (tee-shirt anti-UV idéal). Pensez enfin à la **climatisation** : les écarts brutaux entre 42 °C dehors et 20 °C dans le car ou le bateau favorisent rhumes et maux de gorge ; ayez toujours une petite laine à portée de main."},{"id":"limon-terre-noire-kemet","title":"Le limon, la terre noire (Kemet) et l'agriculture","days":[6],"locations":["Vallée du Nil","Edfou","Louxor (Thèbes)"],"body":"En naviguant entre Assouan et Louxor, observez la berge : une **frange de champs d'un vert intense**, large parfois de quelques centaines de mètres seulement, s'arrête net contre le désert doré. Cette frontière tranchée est le résumé de toute la géographie égyptienne — et le fruit direct du climat et de la crue.\n\nLes anciens Égyptiens nommaient leur pays **Kemet, « la terre noire »**, par opposition à *Decheret*, « la terre rouge » du désert. Le noir n'était pas une couleur de deuil mais de vie : c'était la teinte du **limon** déposé chaque année par la crue. Ce sédiment, arraché aux hauts plateaux d'Éthiopie par les pluies de mousson et charrié sur des milliers de kilomètres, recouvrait les champs d'une boue riche en minéraux. En se retirant, la crue laissait un sol fertilisé et humidifié, idéal pour les semailles d'automne.\n\nCe cadeau climatique annuel a rendu l'agriculture égyptienne parmi les plus productives de l'Antiquité, sans engrais ni jachère : le fleuve faisait le travail. Il structurait aussi le calendrier en trois saisons — *Akhet* (l'inondation, l'été), *Peret* (la « sortie » des terres et les semailles), *Chemou* (la récolte et les basses eaux). Les scènes agricoles peintes dans les tombes que vous verrez — labour, moisson, battage, pressoir — célèbrent ce cycle.\n\nCe monde a basculé en 1970. Avec le haut barrage d'Assouan, **le limon reste piégé dans le lac Nasser** et ne fertilise plus les champs. L'agriculture égyptienne dépend désormais des **engrais chimiques**, et le sol, privé de son rinçage annuel et gorgé d'une irrigation permanente, tend à se **saliniser**. La « terre noire » qui a nourri les pharaons est devenue une terre sous perfusion. Le ruban vert que vous longez existe toujours, mais il ne doit plus rien à la crue : il vit d'eau maîtrisée et de chimie."}],"practical":{"intro":"Températures moyennes indicatives (mini de nuit – maxi de jour, en °C) par ville et par mois. La Haute-Égypte (Assouan, Louxor) est très chaude de mai à septembre : privilégiez les visites tôt le matin. L'hiver (nov.-févr.) est la saison la plus agréable pour la vallée du Nil. À Marsa Alam, la mer se baigne toute l'année ; la température de l'eau est indiquée dans les notes. Il ne pleut pratiquement jamais dans la vallée du Nil et sur la mer Rouge.","byLocation":[{"location":"Le Caire","months":[{"month":"janvier","tempMinMax":"9-19°C","notes":"Doux le jour, frais la nuit ; ciel souvent clair, parfois brumeux."},{"month":"février","tempMinMax":"10-21°C","notes":"Agréable ; premières journées plus chaudes."},{"month":"mars","tempMinMax":"12-24°C","notes":"Début du khamsin (vent de sable chaud) possible."},{"month":"avril","tempMinMax":"15-28°C","notes":"Doux à chaud ; épisodes de khamsin et de poussière."},{"month":"mai","tempMinMax":"18-32°C","notes":"Chaud ; l'été s'installe."},{"month":"juin","tempMinMax":"21-35°C","notes":"Chaud et sec ; canicules possibles."},{"month":"juillet","tempMinMax":"22-35°C","notes":"Chaud, ensoleillé ; un peu d'humidité venue du delta."},{"month":"août","tempMinMax":"22-35°C","notes":"Mois le plus chaud avec juillet ; pics au-delà de 38 °C."},{"month":"septembre","tempMinMax":"20-33°C","notes":"Encore chaud ; les soirées se radoucissent."},{"month":"octobre","tempMinMax":"18-30°C","notes":"Très agréable ; belle arrière-saison."},{"month":"novembre","tempMinMax":"14-25°C","notes":"Doux et lumineux ; l'une des meilleures périodes."},{"month":"décembre","tempMinMax":"11-20°C","notes":"Frais le soir ; prévoir une petite laine."}]},{"location":"Assouan","months":[{"month":"janvier","tempMinMax":"10-23°C","notes":"Saison idéale : journées douces et sèches, nuits fraîches."},{"month":"février","tempMinMax":"12-25°C","notes":"Excellent pour la croisière ; ciel dégagé."},{"month":"mars","tempMinMax":"16-30°C","notes":"Déjà chaud l'après-midi ; agréable le matin."},{"month":"avril","tempMinMax":"21-36°C","notes":"Chaud ; visites tôt conseillées."},{"month":"mai","tempMinMax":"25-40°C","notes":"Très chaud et très sec."},{"month":"juin","tempMinMax":"27-42°C","notes":"Fournaise sèche ; record de 50,9 °C atteint en juin 2024."},{"month":"juillet","tempMinMax":"28-42°C","notes":"Chaleur extrême ; hydratation impérative, sorties à l'aube."},{"month":"août","tempMinMax":"28-42°C","notes":"Chaleur extrême, air très sec."},{"month":"septembre","tempMinMax":"26-41°C","notes":"Encore torride ; commence à baisser en fin de mois."},{"month":"octobre","tempMinMax":"23-37°C","notes":"Chaud mais plus supportable ; belle lumière."},{"month":"novembre","tempMinMax":"17-31°C","notes":"Retour de la douceur ; excellente période."},{"month":"décembre","tempMinMax":"12-25°C","notes":"Journées douces, nuits fraîches ; saison de croisière idéale."}]},{"location":"Louxor","months":[{"month":"janvier","tempMinMax":"6-23°C","notes":"Journées douces, nuits parfois froides (prévoir une veste)."},{"month":"février","tempMinMax":"8-25°C","notes":"Très agréable pour visiter la rive Ouest."},{"month":"mars","tempMinMax":"12-29°C","notes":"Chaud l'après-midi ; matins doux."},{"month":"avril","tempMinMax":"17-35°C","notes":"Chaud ; visites de la Vallée des Rois tôt le matin."},{"month":"mai","tempMinMax":"21-39°C","notes":"Très chaud et sec."},{"month":"juin","tempMinMax":"24-41°C","notes":"Chaleur intense ; épargnez le milieu de journée."},{"month":"juillet","tempMinMax":"25-41°C","notes":"Chaleur extrême, air très sec."},{"month":"août","tempMinMax":"25-41°C","notes":"Chaleur extrême ; hydratation et ombre indispensables."},{"month":"septembre","tempMinMax":"23-39°C","notes":"Encore très chaud."},{"month":"octobre","tempMinMax":"19-36°C","notes":"Chaud mais confortable ; bonne saison."},{"month":"novembre","tempMinMax":"13-29°C","notes":"Doux et ensoleillé ; période idéale."},{"month":"décembre","tempMinMax":"8-24°C","notes":"Douces journées, nuits fraîches à froides."}]},{"location":"Marsa Alam","months":[{"month":"janvier","tempMinMax":"15-23°C","notes":"Doux ; mer ~24 °C, baignade possible (combinaison courte agréable)."},{"month":"février","tempMinMax":"15-23°C","notes":"Mois le plus frais ; mer ~22-23 °C, son plus bas de l'année."},{"month":"mars","tempMinMax":"17-25°C","notes":"Se réchauffe ; mer ~23 °C. Vents parfois soutenus."},{"month":"avril","tempMinMax":"20-28°C","notes":"Agréable ; mer ~24 °C. Excellente saison de snorkeling."},{"month":"mai","tempMinMax":"23-31°C","notes":"Chaud et ensoleillé ; mer ~26 °C, très agréable."},{"month":"juin","tempMinMax":"25-34°C","notes":"Chaud, tempéré par la brise ; mer ~28 °C."},{"month":"juillet","tempMinMax":"27-35°C","notes":"Chaud et un peu humide ; mer ~29 °C."},{"month":"août","tempMinMax":"27-36°C","notes":"Mois le plus chaud ; mer ~30 °C, son maximum. Soleil très fort."},{"month":"septembre","tempMinMax":"26-34°C","notes":"Chaud ; mer ~29 °C. Excellente visibilité sous l'eau."},{"month":"octobre","tempMinMax":"24-31°C","notes":"Idéal ; mer ~28 °C, mer calme, top pour le snorkeling."},{"month":"novembre","tempMinMax":"20-28°C","notes":"Doux et ensoleillé ; mer ~26 °C, très bonne période."},{"month":"décembre","tempMinMax":"17-25°C","notes":"Doux ; mer ~25 °C, baignade encore confortable."}]}]}},"economy":{"category":"economy","updated":"2026-07-14","overview":"## L'Égypte en 2026 : une économie de géant sous tension\n\nAvec près de **118 à 120 millions d'habitants**, l'Égypte est le pays arabe le plus peuplé et la **2e économie d'Afrique** (derrière l'Afrique du Sud/Nigéria selon les années), un PIB nominal d'environ **430 milliards de dollars** (FMI, 2026). C'est un pays jeune, urbain, dont l'économie repose sur quelques piliers fragiles en devises étrangères.\n\n**Les quatre robinets de dollars.** L'Égypte produit peu de ce qu'elle consomme et importe énormément (à commencer par le blé). Pour payer ces importations, elle dépend de : (1) les **remises des expatriés** — record historique de **41,5 milliards $ en 2025**, première source de devises, envoyée surtout par les Égyptiens du Golfe ; (2) le **tourisme** — 19 millions de visiteurs en 2025, ~15 milliards $ de recettes ; (3) le **canal de Suez**, par où transite ~12 % du commerce mondial, mais dont les revenus se sont effondrés (~-50 à -60 %) depuis fin 2023 à cause de la crise houthie en mer Rouge ; (4) le **gaz** méditerranéen, dont l'Égypte était exportatrice mais qu'elle réimporte désormais sous forme de GNL, sa production ayant chuté.\n\n**La crise de la livre et l'inflation.** Depuis 2022, la **livre égyptienne (EGP)** a perdu environ les deux tiers de sa valeur face au dollar au fil de plusieurs dévaluations, la dernière et la plus brutale en **mars 2024** (passage d'un change fixe à un régime flottant, EGP tombée de ~31 à ~50 pour 1 $). L'**inflation** a culminé à ~38 % en septembre 2023, provoquant un appauvrissement massif de la population, avant de refluer vers **12-15 % en 2026** grâce à une politique monétaire très restrictive et au soutien du **FMI** (programme élargi porté à 8 milliards $ en 2024).\n\n**L'armée entrepreneuse.** Particularité égyptienne : l'**armée** est un acteur économique majeur (construction, ciment, agroalimentaire, tourisme, BTP), avec des entreprises exonérées d'impôts et une main-d'œuvre de conscrits. Officiellement 1-1,5 % du PIB selon le président Sissi, mais en pratique bien davantage — au point de gêner le secteur privé et les objectifs fiscaux du FMI.\n\n**Les mégaprojets.** Sous Sissi, l'État bâtit à marche forcée : la **Nouvelle Capitale administrative** à l'est du Caire (coût total estimé ~58 milliards $, pensée pour ~6,5 millions d'habitants), le **Grand Musée Égyptien (GEM)** inauguré en novembre 2025 (1,2 milliard $), l'extension du canal de Suez, des routes et centrales. Ces investissements dopent la croissance (~4,5 % attendus en 2025/26) mais ont creusé une **dette publique élevée** (~90 % du PIB) et beaucoup d'observateurs jugent le modèle — bâtir plutôt que produire — insoutenable.\n\n**Ce que voit le voyageur.** Pour un Français, l'Égypte est **très bon marché** (la chute de la livre a rendu le pays abordable), mais c'est aussi une société où le salaire minimum (~7 000 EGP/mois, soit ~125 €) suffit à peine à vivre. D'où l'omniprésence du **bakchich** (pourboire) : dans un pays où le service est très peu payé, le pourboire n'est pas une option mais une composante réelle du revenu de ceux qui vous accompagnent.","keyNumbers":[{"label":"Taux de change","value":"1 € ≈ 56-57 EGP","asOf":"2026-07"},{"label":"Taux de change (USD)","value":"1 $ ≈ 48-49 EGP","asOf":"2026-07"},{"label":"Inflation annuelle","value":"≈ 14-15 % (pic à 38 % en sept. 2023)","asOf":"2026-05"},{"label":"PIB nominal","value":"≈ 430 milliards $ (2e d'Afrique)","asOf":"2026"},{"label":"Population","value":"≈ 118-120 millions d'habitants","asOf":"2026"},{"label":"Croissance du PIB","value":"≈ 4,5 % (exercice 2025/26)","asOf":"2026"},{"label":"Remises des expatriés","value":"41,5 milliards $ en 2025 (+40 %)","asOf":"2026-02"},{"label":"Touristes","value":"19 millions de visiteurs en 2025 (+21 %)","asOf":"2026"},{"label":"Recettes touristiques","value":"≈ 15 milliards $ / an","asOf":"2025"},{"label":"Dette publique","value":"≈ 90 % du PIB","asOf":"2025"},{"label":"Salaire minimum (privé)","value":"7 000 EGP/mois (≈ 125 €)","asOf":"2025"}],"entries":[{"id":"livre-egyptienne-devaluations","title":"La livre égyptienne et les grandes dévaluations","days":[2,3],"locations":["Le Caire"],"body":"La monnaie du pays est la **livre égyptienne (EGP)**, souvent notée **LE** (pour *livre égyptienne*) ou £E. Elle se divise en 100 piastres, mais celles-ci ont quasiment disparu à cause de l'inflation. Les billets courants vont de 5 à 200 EGP.\n\nDepuis 2022, la livre a vécu une série de **dévaluations** qui lui ont fait perdre environ les deux tiers de sa valeur :\n\n- **Mars 2022** : première dévaluation (~-14 %) après le choc de la guerre en Ukraine (fuite des capitaux, flambée du prix du blé importé).\n- **Octobre 2022 / janvier 2023** : la livre passe de ~19 à ~31 pour 1 $.\n- **6 mars 2024** : la dévaluation décisive. La Banque centrale abandonne le taux fixe et laisse **flotter** la monnaie ; la livre s'effondre de ~31 à ~50 pour 1 $ en un jour. En échange, le FMI, les Émirats et l'UE débloquent des dizaines de milliards de dollars.\n\nAvant mars 2024, il existait un **marché parallèle (marché noir)** où le dollar valait presque le double du taux officiel : tout le monde thésaurisait les devises. Le flottement a fait converger les deux taux et asséché ce marché noir. En 2026, le change est plus stable, autour de **56-57 EGP pour 1 €**. Conséquence pour vous : l'Égypte est devenue **spectaculairement bon marché** pour un porteur d'euros — mais ruineuse pour les Égyptiens qui importent."},{"id":"inflation-vecue","title":"L'inflation vécue par les Égyptiens","days":[2],"locations":["Le Caire"],"body":"Derrière les chiffres, l'inflation a été un traumatisme social. Le taux annuel a **culminé à environ 38 % en septembre 2023**, le plus haut de l'histoire moderne du pays. Les prix de l'alimentation ont parfois doublé en un ou deux ans.\n\nPour une famille moyenne, cela a signifié : l'huile, le sucre, la viande, le poulet et les médicaments devenus difficiles à payer ; une classe moyenne rognée ; et une dépendance accrue au **pain subventionné** (*baladi*) et aux cartes de rationnement dont bénéficient plus de 60 millions d'Égyptiens.\n\nEn 2026, l'inflation a nettement reflué — autour de **14-15 %** (14,6 % en mai 2026) — grâce à des taux d'intérêt très élevés et à la stabilisation de la livre. La Banque centrale vise un retour vers **7 % (± 2 %)** d'ici fin 2026. Mais le mal est fait : les salaires n'ont pas suivi la hausse des prix, et le pouvoir d'achat reste très inférieur à ce qu'il était en 2019.\n\nPourquoi cela vous concerne : cette réalité explique l'insistance sur les pourboires, la débrouille permanente, et le fait que quelques euros représentent pour beaucoup d'Égyptiens une somme significative. Un guide ou un chauffeur qui vous accompagne bien mérite votre générosité — elle change concrètement son mois."},{"id":"tourisme-poids-economique","title":"Le tourisme, poumon des régions que vous visitez","days":[2,4,5,6,7,8],"locations":["Le Caire","Assouan","Louxor","Marsa Alam"],"body":"Le tourisme est l'un des piliers de l'économie et **la première industrie** de plusieurs régions de votre circuit. 2025 a été une année record : **près de 19 millions de visiteurs** (+21 % sur 2024, contre +5 % de moyenne mondiale) et environ **15 milliards de dollars de recettes**. Le secteur emploie directement et indirectement plusieurs millions d'Égyptiens.\n\nLa géographie de votre voyage épouse celle du tourisme :\n\n- **Gizeh / Le Caire** : les pyramides restent le site n°1 (plus de 14 millions de visiteurs en 2025). L'ouverture du **Grand Musée Égyptien** en novembre 2025 a encore dopé l'affluence.\n- **Louxor et Assouan** : le tourisme de croisière sur le Nil est *la* ressource. Les temples (Karnak, Vallée des Rois, Philae, Kom Ombo, Edfou), les bateaux, les calèches, les félouques, l'artisanat local vivent presque entièrement du visiteur étranger. La flotte de bateaux de croisière est repartie à pleine capacité.\n- **Marsa Alam / mer Rouge** : le tourisme balnéaire et la plongée. Les stations (Hurghada, Charm el-Cheikh, Marsa Alam) affichaient plus de 80 % de remplissage en haute saison 2025.\n\nCette dépendance a un revers : le tourisme est très sensible aux crises (attentats, révolutions, Covid, tensions régionales). D'où la présence policière autour des sites et sur les routes, et la nervosité des professionnels — qui se traduit souvent par une sollicitation commerciale intense envers vous."},{"id":"canal-de-suez-houthis","title":"Le canal de Suez et la crise de la mer Rouge","days":[1],"locations":["Le Caire"],"body":"Le **canal de Suez**, qui relie la Méditerranée à la mer Rouge, est l'un des joyaux stratégiques de l'Égypte : environ **12 % du commerce mondial** y transite normalement, et il rapportait à l'État autour de **9-10 milliards de dollars par an** de droits de passage — une manne en devises qui ne dépend d'aucune importation.\n\nDepuis **fin 2023**, cette manne s'est effondrée. En réaction à la guerre de Gaza, les rebelles **houthis** du Yémen ont attaqué les navires en mer Rouge et dans le détroit de Bab el-Mandeb (entrée sud). Les grandes compagnies maritimes ont détourné leurs porte-conteneurs par le **cap de Bonne-Espérance** (Afrique du Sud), ce qui ajoute ~10 jours de trajet et près d'un million de dollars de carburant par voyage — mais évite la zone de danger.\n\nRésultat : le nombre de navires a chuté de plus de moitié, et les **revenus du canal ont plongé d'environ 50 à 60 %**. Les autorités égyptiennes estiment la perte cumulée à environ **10 milliards de dollars** à la mi-2026 — un trou béant dans les comptes en devises, au pire moment de la crise monétaire.\n\nLe **cessez-le-feu à Gaza** entré en vigueur en octobre 2025 a laissé espérer un retour progressif du trafic, les Houthis ayant suspendu leurs menaces, mais la normalisation complète reste prudente et lente. C'est l'un des grands aléas de l'économie égyptienne en 2026."},{"id":"grand-musee-egyptien","title":"Le Grand Musée Égyptien (GEM), vitrine du pays","days":[3],"locations":["Le Caire","Gizeh"],"body":"Vous visitez le **Grand Musée Égyptien (GEM)** le jour 3 : c'est le mégaprojet culturel le plus emblématique de l'Égypte moderne. Inauguré officiellement le **1er novembre 2025** après une vingtaine d'années de chantier, il aura coûté environ **1,2 milliard de dollars** (financé en partie par un prêt japonais).\n\nQuelques chiffres à connaître avant la visite :\n\n- **Le plus grand musée au monde** consacré à une seule civilisation.\n- Environ **50 000 objets** exposés, dont, pour la première fois réunie et intégralement présentée, **toute la collection du trésor de Toutânkhamon** (plus de 5 000 pièces).\n- Un **colosse de granit de Ramsès II** accueille les visiteurs dans le grand hall ; un escalier monumental mène aux douze galeries.\n- Situé à **2 km des pyramides de Gizeh**, il est pensé pour attirer ~5 millions de visiteurs par an.\n\nAu-delà de son intérêt archéologique, le GEM est un **outil économique** : l'Égypte l'a conçu pour rallonger la durée des séjours touristiques au Caire, capter des devises et redorer son image internationale. L'inauguration, en présence de nombreux chefs d'État et têtes couronnées, fut une opération de prestige national. C'est le pendant culturel des grands chantiers d'infrastructure du régime."},{"id":"nouvelle-capitale-megaprojets","title":"La Nouvelle Capitale et les mégaprojets du Caire","days":[1,2],"locations":["Le Caire"],"body":"En route depuis l'aéroport ou en périphérie du Caire, vous apercevrez peut-être les tours de la **Nouvelle Capitale administrative** (rebaptisée *The New Capital* en novembre 2025, avec un projet de la nommer « Memphis »). C'est le chantier le plus démesuré du règne du président Sissi.\n\n- Construite **à l'est du Caire**, dans le désert, sur une superficie
