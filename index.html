<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Égypte">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Bible de voyage — Égypte</title>
<style>
/* ===================== THEME TOKENS ===================== */
:root{
  --bg:#0f1115; --bg2:#141821; --card:#1a1f2b; --card2:#212736;
  --text:#ece6d8; --muted:#9aa1af; --faint:#6f7684;
  --gold:#d6b56a; --gold-dim:#b9974f; --sand:#e3d3ac; --nile:#5fb0a6;
  --border:#2a3140; --border-soft:#232a37;
  --shadow:0 6px 22px rgba(0,0,0,.35);
  --tap:rgba(214,181,106,.14);
  --radius:16px; --radius-sm:11px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --header-h:52px; --tab-h:58px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4efe4; --bg2:#efe8d8; --card:#fffdf8; --card2:#f7f1e4;
    --text:#2b2620; --muted:#6d665a; --faint:#938b7c;
    --gold:#9a7a34; --gold-dim:#87692a; --sand:#8a7440; --nile:#2f7e75;
    --border:#e2d9c4; --border-soft:#ece3d0;
    --shadow:0 6px 20px rgba(120,100,60,.14);
    --tap:rgba(154,122,52,.12);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.62; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;}
::selection{background:var(--tap);}

/* Arabic sizing */
.ar{font-family:"Geeza Pro","Damascus","Al Bayan","Noto Naskh Arabic",serif;direction:rtl;unicode-bidi:isolate;}

/* ===================== LAYOUT ===================== */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  padding-top:var(--safe-t);
  height:calc(var(--header-h) + var(--safe-t));
  display:flex;align-items:center;gap:6px;
  padding-left:8px;padding-right:8px;
  background:color-mix(in srgb,var(--bg) 82%, transparent);
  backdrop-filter:saturate(150%) blur(16px);
  -webkit-backdrop-filter:saturate(150%) blur(16px);
  border-bottom:1px solid var(--border-soft);
}
#topbar .ttl{
  flex:1;text-align:center;font-weight:640;font-size:16.5px;letter-spacing:.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;
}
.iconbtn{
  width:44px;height:44px;min-width:44px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;color:var(--text);
}
.iconbtn:active{background:var(--tap);}
.iconbtn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.iconbtn.ghost{visibility:hidden;}

#view{
  padding-top:calc(var(--header-h) + var(--safe-t));
  padding-bottom:calc(var(--tab-h) + var(--safe-b) + 12px);
  min-height:100%;
}
.page{padding:14px 15px 4px;animation:fade .28s ease;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

#tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding-bottom:var(--safe-b);
  height:calc(var(--tab-h) + var(--safe-b));
  display:flex;
  background:color-mix(in srgb,var(--bg) 86%, transparent);
  backdrop-filter:saturate(150%) blur(18px);
  -webkit-backdrop-filter:saturate(150%) blur(18px);
  border-top:1px solid var(--border-soft);
}
#tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--faint);font-size:10.5px;font-weight:560;letter-spacing:.2px;padding-top:6px;
}
#tabbar button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
#tabbar button.on{color:var(--gold);}

/* ===================== TYPOGRAPHY / BLOCKS ===================== */
h1.big{font-size:26px;line-height:1.18;margin:2px 0 4px;letter-spacing:-.3px;font-weight:720;}
.eyebrow{color:var(--gold);font-size:12px;font-weight:680;letter-spacing:1.4px;text-transform:uppercase;margin:0 0 6px;}
.lede{color:var(--muted);font-size:15.5px;margin:0 0 14px;}
.sect-h{font-size:13px;font-weight:680;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin:22px 2px 10px;}
hr.rule{border:none;border-top:1px solid var(--border-soft);margin:20px 0;}

/* markdown */
.md{font-size:16.5px;}
.md h2,.md h3,.md h4,.md h5{line-height:1.25;letter-spacing:-.2px;margin:20px 0 8px;font-weight:680;}
.md h3{font-size:20px;} .md h4{font-size:17.5px;color:var(--sand);} .md h5{font-size:16px;color:var(--sand);}
.md p{margin:0 0 13px;}
.md strong{color:var(--text);font-weight:680;}
.md em{color:var(--sand);font-style:italic;}
.md code{background:var(--card2);padding:1px 6px;border-radius:6px;font-size:.9em;font-family:ui-monospace,Menlo,monospace;}
.md ul,.md ol{margin:0 0 14px;padding-left:22px;}
.md li{margin:4px 0;}
.md ul li::marker{color:var(--gold);}
.md ol li::marker{color:var(--gold);font-weight:680;}

/* cards */
.card{
  background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);
  padding:15px 16px;margin:0 0 12px;box-shadow:var(--shadow);
}
.tapcard{display:block;transition:transform .12s ease;}
.tapcard:active{transform:scale(.985);background:var(--card2);}

/* day cards */
.daycard{display:flex;gap:13px;align-items:flex-start;}
.daynum{
  flex:none;width:46px;height:46px;border-radius:13px;
  background:linear-gradient(150deg,var(--gold),var(--gold-dim));
  color:#1a1206;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:760;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.25);
}
.daynum small{font-size:8.5px;font-weight:640;opacity:.72;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px;}
.daynum b{font-size:18px;}
.dc-body{flex:1;min-width:0;}
.dc-title{font-weight:660;font-size:16.5px;line-height:1.25;margin:1px 0 4px;}
.dc-meta{color:var(--muted);font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.pin{display:inline-flex;align-items:center;gap:3px;}
.pin svg{width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:2;}
.chev{color:var(--faint);flex:none;align-self:center;}
.chev svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* chips / badges */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0 2px;}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--card2);border:1px solid var(--border-soft);
  color:var(--sand);font-size:12.5px;font-weight:580;
  padding:6px 11px;border-radius:999px;min-height:32px;
}
.chip.on{border-color:var(--gold);color:var(--gold);}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;}
.chip.cat-history .dot{background:#d68a4e;}
.chip.cat-geography .dot{background:var(--nile);}
.chip.cat-climate .dot{background:#7aa7e0;}
.chip.cat-economy .dot{background:#c98fb0;}
a.chip:active{background:var(--card);}

.daybadge{
  display:inline-flex;align-items:center;justify-content:center;gap:4px;
  background:linear-gradient(150deg,var(--gold),var(--gold-dim));color:#1a1206;
  font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:999px;min-height:30px;
}
a.daybadge:active{opacity:.85;}

/* section list rows (fiches) */
.row{
  display:flex;align-items:center;gap:12px;padding:13px 15px;
  background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius-sm);
  margin:0 0 9px;
}
.row .rr{flex:1;min-width:0;display:flex;flex-direction:column;}
.row .rt{display:block;font-weight:620;font-size:16px;line-height:1.28;}
.row .rs{display:block;color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;}
.leadicon{flex:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.leadicon svg{width:20px;height:20px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.cat-history .leadicon{background:rgba(214,138,78,.16);}.cat-history .leadicon svg{stroke:#d68a4e;}
.cat-geography .leadicon{background:rgba(95,176,166,.16);}.cat-geography .leadicon svg{stroke:var(--nile);}
.cat-climate .leadicon{background:rgba(122,167,224,.16);}.cat-climate .leadicon svg{stroke:#7aa7e0;}
.cat-economy .leadicon{background:rgba(201,143,176,.16);}.cat-economy .leadicon svg{stroke:#c98fb0;}

/* fun fact / keynumbers */
.callout{
  border:1px solid var(--gold-dim);background:
    linear-gradient(160deg,color-mix(in srgb,var(--gold) 14%,transparent),transparent);
  border-radius:var(--radius);padding:13px 15px;margin:16px 0;
}
.callout .lab{color:var(--gold);font-size:11.5px;font-weight:720;letter-spacing:1px;text-transform:uppercase;display:flex;align-items:center;gap:6px;margin-bottom:5px;}
.callout .lab svg{width:15px;height:15px;fill:var(--gold);}
.kn-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0 4px;}
.kn{background:var(--card2);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:11px 12px;}
.kn .knv{font-size:16px;font-weight:720;color:var(--gold);line-height:1.2;}
.kn .knl{font-size:12px;color:var(--muted);margin-top:3px;}
.kn .kno{font-size:10.5px;color:var(--faint);margin-top:2px;}

/* glossary */
.acc{background:var(--card);border:1px solid var(--border-soft);border-radius:var(--radius);margin:0 0 10px;overflow:hidden;}
.acc>summary{
  list-style:none;cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:10px;
  font-weight:640;font-size:16.5px;min-height:52px;
}
.acc>summary::-webkit-details-marker{display:none;}
.acc>summary .cnt{margin-left:auto;color:var(--faint);font-size:13px;font-weight:560;}
.acc>summary .caret{color:var(--gold);transition:transform .2s;}
.acc>summary .caret svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.acc[open]>summary .caret{transform:rotate(90deg);}
.acc .accbody{padding:2px 12px 8px;}
.word{padding:12px 4px;border-top:1px solid var(--border-soft);}
.word:first-child{border-top:none;}
.word .wtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;}
.word .wfr{font-weight:640;font-size:16px;flex:1;}
.word .war{font-size:23px;line-height:1.3;color:var(--sand);}
.word .wtrans{color:var(--gold);font-weight:640;font-size:15px;margin-top:3px;}
.word .wpron{
  display:inline-block;margin-top:5px;background:var(--card2);border:1px dashed var(--gold-dim);
  color:var(--gold);font-weight:680;font-size:13.5px;letter-spacing:.4px;padding:3px 10px;border-radius:8px;
}
.word .wnotes{color:var(--muted);font-size:13.5px;margin-top:6px;}

/* practical weather */
.seg{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:12px;margin:2px 0 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.seg button{flex:1;white-space:nowrap;padding:8px 12px;border-radius:9px;font-size:13.5px;font-weight:620;color:var(--muted);min-height:38px;}
.seg button.on{background:var(--card);color:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.18);}
.wx{width:100%;border-collapse:collapse;font-size:14.5px;}
.wx td{padding:9px 6px;border-top:1px solid var(--border-soft);vertical-align:top;}
.wx .m{font-weight:620;width:82px;color:var(--sand);text-transform:capitalize;}
.wx .t{font-weight:700;color:var(--gold);width:82px;white-space:nowrap;}
.wx .n{color:var(--muted);font-size:13px;}

/* timeline */
.tl{position:relative;padding-left:20px;margin-top:6px;}
.tl::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--gold),var(--border));}
.tlrow{position:relative;padding:0 0 18px 4px;}
.tlrow::before{content:"";position:absolute;left:-19px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);}
.tlrow .tld{color:var(--gold);font-weight:720;font-size:13px;letter-spacing:.3px;}
.tlrow .tlp{font-weight:640;font-size:16px;margin:1px 0 3px;}
.tlrow .tls{color:var(--muted);font-size:14px;}
.tlrow .kf{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px;}
.tlrow .kf span{font-size:11.5px;color:var(--sand);background:var(--card2);border:1px solid var(--border-soft);padding:2px 8px;border-radius:999px;}

/* search */
#search{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;padding-top:var(--safe-t);}
#search.on{display:flex;}
#search .sbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border-soft);}
#search input{
  flex:1;background:var(--card2);border:1px solid var(--border-soft);border-radius:12px;
  color:var(--text);font-size:16.5px;padding:11px 14px;outline:none;min-height:44px;
}
#search input:focus{border-color:var(--gold-dim);}
#search .cancel{color:var(--gold);font-weight:620;padding:8px 6px;font-size:15.5px;}
#sresults{flex:1;overflow-y:auto;padding:10px 14px calc(var(--safe-b) + 20px);-webkit-overflow-scrolling:touch;}
.sr-h{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);margin:16px 2px 8px;}
.sr{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--border-soft);}
.sr .rr{flex:1;min-width:0;display:flex;flex-direction:column;}
.sr .srt{display:block;font-weight:600;font-size:15.5px;}.sr .srs{display:block;color:var(--muted);font-size:13px;}
.sr .tag{flex:none;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);}
.empty{color:var(--faint);text-align:center;padding:40px 20px;font-size:15px;}
mark{background:transparent;color:var(--gold);font-weight:700;}

/* misc */
.hero{
  border-radius:var(--radius);padding:18px 17px;margin:0 0 16px;
  background:
    radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 60%),
    linear-gradient(160deg,var(--card2),var(--card));
  border:1px solid var(--border-soft);box-shadow:var(--shadow);
}
.hero .sub{color:var(--muted);font-size:14.5px;margin-top:8px;}
.metline{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--muted);}
.metline b{color:var(--sand);font-weight:640;}
.footnote{text-align:center;color:var(--faint);font-size:12px;margin:26px 0 6px;letter-spacing:.2px;}
.accinfo{color:var(--muted);font-size:13.5px;margin-top:6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.catcard{border-radius:var(--radius);padding:15px;border:1px solid var(--border-soft);box-shadow:var(--shadow);}
.catcard .cn{font-weight:680;font-size:17px;margin-top:9px;}
.catcard .cd{color:var(--muted);font-size:13px;margin-top:3px;}
.catcard .ci{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.catcard .ci svg{width:23px;height:23px;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}

/* ===================== CARTE (onglet Voyage) ===================== */
:root{
  --sea:#0b1e33; --sea-edge:#1c3d5a; --sealab:#5c81a6;
  --land:#1b2029; --land-edge:#c8a24e; --offmap:#0b0d12;
  --nileblue:#3f86a0; --maplab:#e3d3ac; --region:#697180;
}
@media (prefers-color-scheme:light){
  :root{
    --sea:#c9dcef; --sea-edge:#a6c4df; --sealab:#5f7fa0;
    --land:#efe4cb; --land-edge:#9a7a34; --offmap:#e6dbc4;
    --nileblue:#3f8fa8; --maplab:#5a4e33; --region:#a89d87;
  }
}
/* Toggle Carte / Liste */
.vtoggle{display:flex;gap:5px;background:var(--card2);border:1px solid var(--border-soft);padding:4px;border-radius:12px;margin:2px 0 14px;}
.vtoggle button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:9px;font-size:14px;font-weight:620;color:var(--muted);min-height:40px;}
.vtoggle button.on{background:var(--card);color:var(--gold);box-shadow:0 1px 4px rgba(0,0,0,.18);}
.vtoggle button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
/* Carte */
.mapwrap{position:relative;width:100%;aspect-ratio:575/500;border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--border-soft);background:var(--offmap);box-shadow:var(--shadow);margin:0 0 12px;}
.egmap{position:absolute;inset:0;width:100%;height:100%;display:block;font-family:inherit;}
.egmap .sea{fill:var(--sea);stroke:var(--sea-edge);stroke-width:.7;}
.egmap .land{fill:var(--land);stroke:var(--land-edge);stroke-width:1.5;stroke-linejoin:round;}
.egmap .nile{fill:none;stroke:var(--nileblue);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;}
.egmap .nile.thin{stroke-width:1.7;}
.egmap .lake{fill:var(--nileblue);opacity:.82;stroke:none;}
.egmap .route{fill:none;stroke:var(--gold);stroke-linecap:round;stroke-linejoin:round;}
.egmap .r-plane{stroke-width:2;stroke-dasharray:1.5 5.5;}
.egmap .r-cruise{stroke-width:2.6;}
.egmap .r-bus{stroke-width:2;stroke-dasharray:7 5;}
.egmap .pas{fill:var(--gold);stroke:#efe4cb;stroke-width:1.4;}
.egmap .pasnum{fill:#1a1206;font-size:12px;font-weight:800;text-anchor:middle;dominant-baseline:central;}
.egmap .dot{fill:var(--gold);stroke:var(--offmap);stroke-width:1;}
.egmap .poi{fill:var(--offmap);stroke:var(--sand);stroke-width:1.8;}
.egmap .poi.opt{fill:var(--gold);fill-opacity:.5;stroke:var(--gold);}
.egmap .mlab{fill:var(--maplab);font-size:12.5px;font-weight:640;}
.egmap .mlab.sub{fill:var(--gold);font-size:11px;font-weight:700;}
.egmap .rlab{fill:var(--region);font-size:11px;font-weight:640;letter-spacing:2px;}
.egmap .slab{fill:var(--sealab);font-size:12.5px;font-weight:640;letter-spacing:2px;}
.egmap .nlab{fill:var(--nileblue);font-size:12px;font-weight:640;font-style:italic;}
.egmap .tap{fill:transparent;cursor:pointer;}
.egmap .lens{fill:none;stroke:var(--gold);stroke-width:1;stroke-dasharray:3 3;opacity:.7;}
.egmap .inset-bg{fill:var(--card);stroke:var(--gold-dim);stroke-width:1.2;}
.egmap .inset-t{fill:var(--gold);font-size:12px;font-weight:800;letter-spacing:.3px;}
.egmap .inset-sub{fill:var(--faint);font-size:9.5px;font-weight:600;}
.egmap .irow:active .irow-hit{fill:var(--tap);}
.egmap .ilab{fill:var(--text);font-size:12.5px;font-weight:640;}
.egmap .iday{fill:var(--gold);font-size:11px;font-weight:700;}
.egmap .leg-bg{fill:var(--card);opacity:.94;stroke:var(--border-soft);stroke-width:1;}
.egmap .leg-t{fill:var(--muted);font-size:11px;font-weight:600;}
/* Infobulle POI (overlay HTML) */
.mtip{position:absolute;z-index:6;max-width:172px;background:var(--card);border:1px solid var(--gold-dim);
  border-radius:11px;padding:8px 11px;font-size:12.5px;line-height:1.38;color:var(--text);
  box-shadow:var(--shadow);transform:translate(-50%,calc(-100% - 12px));display:none;pointer-events:none;}
.mtip.on{display:block;animation:fade .16s ease;}
.mtip b{display:block;color:var(--gold);font-size:12px;font-weight:700;margin-bottom:2px;}
.mtip::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;

<script id="data" type="application/json">{"circuit":{"name":"Les Merveilles de l'Égypte + Fayrouz Plaza 5*","reference":"N41/J51","duration_label":"15J / 14N","duration_days":15,"duration_nights":14,"language":"Guide égyptologue francophone","structure":"Circuit culturel (Le Caire + croisière sur le Nil, 5 nuits) puis extension balnéaire all inclusive en mer Rouge (Marsa Alam, 7 nuits)","accommodations":[{"name":"Grand Nile Tower Hôtel 5* (ou similaire)","type":"hôtel","location":"Le Caire","nights":"1 à 2 (2 nuits)","details":"Un des hôtels les plus luxueux du Caire, au centre-ville, vue sur le Nil, ~40 min des pyramides de Gizeh, ~20 km de l'aéroport. 715 chambres/suites (34 à 200 m²), 7 restaurants dont un restaurant tournant, spa, 2 piscines à température contrôlée, piscine et club enfants."},{"name":"M/S King Of Thèbes 5* (ou similaire)","type":"bateau de croisière (Nil)","location":"Croisière Assouan → Louxor","nights":"3 à 7 (5 nuits à bord)","details":"Bateau de croisière luxueux rénové en été 2023. 63 cabines de 22 m² + 1 suite, toutes avec grande fenêtre et salle de bain privée. Réception 24h/24, restaurant, bar/lounge/discothèque, salle de lecture, wifi gratuit illimité, salle de fitness, spa (payant), piscine extérieure, boutique. Formule tout inclus en supplément (10h-22h). Tea time à 16h sur le pont supérieur."},{"name":"Three Corners Fayrouz Plaza 5* Marsa Alam","type":"hôtel balnéaire (all inclusive)","location":"Marsa Alam (mer Rouge)","nights":"8 à 14 (7 nuits)","details":"471 chambres sur un grand domaine paysager, toutes avec balcon (vue mer partielle/complète, piscine ou jardin). 3 piscines, jacuzzi extérieur, plage privée, 10 restaurants et bars, centre de plongée, équitation et promenades en chameau, terrains de sport."}],"flights":["Aller : Paris → Le Caire (jour 1)","Domestique : Le Caire → Assouan (jour 3)","Option jour 5 : vol Assouan → Abou Simbel → Assouan (excursion facultative, sinon en car)","Retour : Hurghada → Paris via Le Caire (jour 15)"],"note":"Selon les horaires des vols et impératifs locaux, l'ordre des visites peut être modifié."},"itinerary":[{"day":1,"date":"","title":"Paris – Le Caire","locations":["Paris","Le Caire"],"sites":[],"activities":"Rendez-vous à l'aéroport, vol vers Le Caire. Accueil par les représentants locaux, assistance aux formalités d'entrée, transfert à l'hôtel et prise de connaissance avec le guide égyptologue francophone.","meals":"Dîner","accommodation":"Grand Nile Tower Hôtel 5*, Le Caire","notes":"Journée d'arrivée."},{"day":2,"date":"","title":"Le Caire (Saqqarah, Memphis, Gizeh, Caire islamique)","locations":["Le Caire","Sakkarah","Memphis","Gizeh"],"sites":["Pyramide à degrés de Djoser (Saqqarah, 2700 av. J.-C.)","Memphis","Plateau de Gizeh","Pyramide de Khéops","Pyramide de Khephren et son temple de granit rose","Pyramide de Mykérinos","Pyramides des reines","Sphinx de Gizeh","Le Caire islamique (citadelle, mosquée de Mohamed Ali, minarets)","Souk de Khan el Khalili"],"activities":"Visite de Saqqarah et Memphis (pyramide à degrés de Djoser). Déjeuner dans un restaurant typique. Découverte du plateau de Gizeh (Khéops, Khephren, Mykérinos, pyramides des reines, Sphinx). Visite du Caire islamique (citadelle, mosquée de Mohamed Ali) puis souks de Khan el Khalili.","meals":"Petit déjeuner, déjeuner (restaurant typique), dîner (restaurant typique à Khan el Khalili)","accommodation":"Grand Nile Tower Hôtel 5*, Le Caire","notes":"Khéops est la dernière des 7 merveilles du monde ; le Sphinx est la plus grande sculpture monolithique du monde."},{"day":3,"date":"","title":"Le Caire – Assouan","locations":["Le Caire","Assouan"],"sites":["Grand Musée Égyptien (GEM)"],"activities":"Petit déjeuner puis visite du Grand Musée Égyptien (« GEM », douze galeries), situé près des pyramides et abritant la plus grande collection d'antiquités égyptiennes au monde. Transfert à l'aéroport et envol pour Assouan, installation à bord du bateau de croisière.","meals":"Petit déjeuner","accommodation":"M/S King of Thèbes 5* (bateau de croisière), Assouan","notes":"Vol intérieur Le Caire → Assouan ; embarquement pour la croisière sur le Nil."},{"day":4,"date":"","title":"Assouan","locations":["Assouan","Île de Philae","Île Éléphantine"],"sites":["Temple d'Isis de Philae (île de Philaé)","Île Éléphantine (promenade en felouque)","Haut barrage d'Assouan","Obélisque inachevé (carrière de granite, 41,75 m)"],"activities":"Visite du temple d'Isis de Philae (commencé par Nectanébo Ier, XXXe dynastie, achevé par les Romains). Promenade en felouque autour de l'île Éléphantine et commerces locaux. Départ pour le haut barrage et l'obélisque inachevé, le plus grand connu à ce jour (41,75 m). En soirée, spectacle son et lumière au temple de Philae en option.","meals":"Pension complète à bord","accommodation":"M/S King of Thèbes 5* (bateau), Assouan","notes":"La région d'Assouan (schiste, albâtre, granite rose) a fourni les blocs des pyramides et colosses. Nuit à bord."},{"day":5,"date":"","title":"Assouan – Kom Ombo","locations":["Assouan","Kom Ombo","Abou Simbel (option)"],"sites":["Temples d'Abou Simbel (Ramsès II) — excursion en option","Temple de Kom Ombo (dédié à Sobek et Haroeris)"],"activities":"Matinée libre en ville. En option, excursion en car ou en avion vers les temples d'Abou Simbel (Ramsès II), retour à Assouan pour le déjeuner. Navigation vers Kom Ombo et visite du temple double dédié à Haroeris (dieu à tête d'épervier, partie Nord) et Sobek (dieu crocodile, partie Sud).","meals":"Pension complète à bord","accommodation":"M/S King of Thèbes 5* (bateau)","notes":"Excursion Abou Simbel facultative (en supplément). Navigation vers Edfou après la visite."},{"day":6,"date":"","title":"Edfou – Esna – Louxor","locations":["Edfou","Esna","Louxor (Thèbes)"],"sites":["Temple d'Edfou (dieu faucon Horus)","Écluse d'Esna","Temple de Karnak","Temple de Louxor","Dromos (allée de sphinx entre Karnak et Louxor)"],"activities":"Départ matinal, excursion en calèche jusqu'au temple d'Edfou (Horus), plus grand temple ptolémaïque et temple le mieux conservé d'Égypte. Retour au bateau, passage de l'écluse d'Esna en milieu de journée. Arrivée à Louxor, visite de la partie Sud de l'ancienne Thèbes : temples de Karnak et de Louxor, reliés par un dromos, dédiés à Amon.","meals":"Pension complète à bord","accommodation":"M/S King of Thèbes 5* (bateau), Louxor","notes":"Temple de Louxor érigé au XIVe s. av. J.-C. sous Amenhotep III, modifié par Ramsès II. En soirée, spectacle son et lumière à Karnak en option."},{"day":7,"date":"","title":"Louxor (rive Ouest / Thèbes)","locations":["Louxor (Thèbes)"],"sites":["Nécropole de Thèbes (rive Ouest du Nil)","Vallée des Rois","Vallée des Reines","Colosses de Memnon (temple d'Amenhotep III)","Deir el-Bahari — temple funéraire de la reine Hatchepsout"],"activities":"Petit déjeuner, visite de la nécropole de Thèbes (rive Ouest) : Vallée des Rois et Vallée des Reines (tombes des pharaons du Nouvel Empire, familles et nobles). Puis Colosses de Memnon et Deir el-Bahari, temple funéraire d'Hatchepsout (temple à trois terrasses bâti en -1455, dédié à Amon, chapelles d'Anubis et Hathor).","meals":"Pension complète à bord","accommodation":"M/S King of Thèbes 5* (bateau), Louxor","notes":"Hatchepsout : l'une des quatre pharaonnes à avoir gouverné l'Égypte. Retour au bateau, dîner et nuit."},{"day":"8-14","date":"","title":"Louxor – Marsa Alam (séjour balnéaire)","locations":["Louxor","Marsa Alam"],"sites":[],"activities":"Petit déjeuner puis transfert (jour 8) de Louxor jusqu'à l'hôtel de Marsa Alam. Séjour libre en formule all inclusive au bord de la mer Rouge (jours 8 à 14).","meals":"All inclusive","accommodation":"Three Corners Fayrouz Plaza 5*, Marsa Alam","notes":"7 nuits de détente balnéaire (plage privée, piscines, plongée possible)."},{"day":15,"date":"","title":"Marsa Alam – Hurghada – Paris","locations":["Marsa Alam","Hurghada","Le Caire","Paris"],"sites":[],"activities":"Petit déjeuner et, selon les horaires de vols, transfert à l'aéroport d'Hurghada et envol pour Paris via Le Caire.","meals":"Petit déjeuner","accommodation":"","notes":"Journée de retour. Vol Hurghada → Le Caire → Paris."}],"history":{"category":"history","updated":"2026-07-14","overview":"## Cinq mille ans en un fil\n\nL'histoire égyptienne est la plus longue continuité politique et culturelle de l'humanité. Tout commence le long du Nil, seul ruban de vie dans le désert. Dès le **Prédynastique** (vers -5500 à -3150), des villages agricoles s'organisent en deux royaumes rivaux : la Haute-Égypte (le Sud, la vallée étroite) et la Basse-Égypte (le Nord, le delta).\n\nVers **-3150**, un roi du Sud — que la tradition nomme Ménès et que l'archéologie identifie à **Narmer** — unifie les Deux Terres. Naît alors la royauté pharaonique et l'écriture hiéroglyphique. On numérote les souverains en **trente dynasties**, regroupées en grandes époques.\n\nL'**Ancien Empire** (-2700 à -2200) est l'âge des pyramides : Djoser à Saqqarah, puis Khéops, Khephren et Mykérinos à Gizeh. L'État, centré sur Memphis, atteint une puissance et une maîtrise technique inégalées, avant de s'effondrer dans la **Première Période intermédiaire**, marquée par la sécheresse et l'anarchie.\n\nLes princes de Thèbes réunifient le pays et ouvrent le **Moyen Empire** (-2050 à -1710), âge classique de la langue et de la littérature. Suit une nouvelle rupture : les **Hyksôs**, envahisseurs venus du Levant, dominent le delta pendant la Deuxième Période intermédiaire.\n\nChassés par les rois thébains, ceux-ci fondent le **Nouvel Empire** (-1550 à -1070), apogée impérial de l'Égypte. C'est le temps des grands noms : la reine **Hatchepsout**, le conquérant **Thoutmôsis III**, l'hérétique **Akhenaton** et son culte du disque solaire, le jeune **Toutânkhamon**, et surtout **Ramsès II**, bâtisseur d'Abou Simbel. Thèbes (Louxor) devient capitale religieuse ; Karnak, temple d'Amon, en est le cœur. Les pharaons se font enterrer dans la **Vallée des Rois**.\n\nAprès -1070, l'Égypte se morcelle (**Troisième Période intermédiaire**), passe sous domination libyenne, nubienne puis assyrienne, se redresse brièvement à la **Basse Époque**, avant d'être conquise par les Perses puis, en **-332**, par **Alexandre le Grand**. Ses successeurs, les **Ptolémées**, dynastie grecque, règnent depuis Alexandrie et bâtissent les temples admirablement conservés d'Edfou, Kom Ombo et Philae. La dernière d'entre eux, **Cléopâtre VII**, se suicide en -30 : l'Égypte devient province romaine.\n\nGrenier de Rome puis de Byzance, l'Égypte se christianise : c'est l'**Égypte copte**. En **641**, les armées arabes musulmanes la conquièrent. Suivent treize siècles d'**Égypte islamique** : Fatimides fondateurs du Caire, Saladin et sa citadelle, sultans mamelouks, puis Ottomans à partir de 1517.\n\nL'**époque moderne** s'ouvre avec l'expédition de **Bonaparte** (1798), qui révèle l'Égypte pharaonique à l'Europe et permet, via la pierre de Rosette, le déchiffrement des hiéroglyphes. **Mohamed Ali** modernise le pays au XIXe siècle ; le canal de Suez (1869) le place au carrefour du monde. En **1952**, la révolution de **Nasser** met fin à la monarchie ; le haut barrage d'Assouan et la nationalisation de Suez deviennent les symboles de l'Égypte indépendante que vous visitez aujourd'hui.","timeline":[{"period":"Période prédynastique","dates":"-5500 à -3150","summary":"Villages agricoles le long du Nil qui se regroupent peu à peu en deux royaumes, la Haute et la Basse-Égypte.","keyFigures":["Scorpion"]},{"period":"Période thinite (dynasties I-II)","dates":"-3150 à -2700","summary":"Unification des Deux Terres et naissance de la royauté pharaonique et de l'écriture hiéroglyphique.","keyFigures":["Narmer (Ménès)"]},{"period":"Ancien Empire","dates":"-2700 à -2200","summary":"L'âge d'or des pyramides depuis Memphis : Saqqarah puis Gizeh, apogée de l'architecture funéraire.","keyFigures":["Djoser","Snéfrou","Khéops","Khephren","Mykérinos"]},{"period":"Première Période intermédiaire","dates":"-2200 à -2050","summary":"Effondrement du pouvoir central, sécheresse et rivalités entre principautés.","keyFigures":[]},{"period":"Moyen Empire","dates":"-2050 à -1710","summary":"Réunification par les princes thébains ; âge classique de la langue, de la littérature et de l'art.","keyFigures":["Montouhotep II","Sésostris III","Amenemhat III"]},{"period":"Deuxième Période intermédiaire (Hyksôs)","dates":"-1710 à -1550","summary":"Le delta passe sous domination des Hyksôs venus du Levant, qui introduisent le cheval et le char.","keyFigures":["Apopi","Seqenenrê Taâ"]},{"period":"Nouvel Empire","dates":"-1550 à -1070","summary":"Apogée impérial de l'Égypte ; Thèbes capitale, Karnak, Vallée des Rois, grands conquérants et bâtisseurs.","keyFigures":["Hatchepsout","Thoutmôsis III","Amenhotep III","Akhenaton","Toutânkhamon","Séthi Ier","Ramsès II"]},{"period":"Troisième Période intermédiaire","dates":"-1070 à -664","summary":"Morcellement du pays, dynasties libyennes puis nubiennes (kouchites), invasion assyrienne.","keyFigures":["Chéchonq Ier","Piânkhy","Taharqa"]},{"period":"Basse Époque","dates":"-664 à -332","summary":"Renaissance saïte, puis dominations perses entrecoupées de brefs sursauts d'indépendance.","keyFigures":["Psammétique Ier","Nectanébo Ier","Nectanébo II"]},{"period":"Période ptolémaïque","dates":"-332 à -30","summary":"Conquête d'Alexandre puis dynastie grecque des Lagides depuis Alexandrie ; grands temples tardifs.","keyFigures":["Alexandre le Grand","Ptolémée Ier","Cléopâtre VII"]},{"period":"Égypte romaine et byzantine","dates":"-30 à 641","summary":"Province de Rome puis de Byzance, grenier à blé de l'Empire, christianisation et essor de l'Église copte.","keyFigures":["Auguste","Trajan"]},{"period":"Égypte islamique médiévale","dates":"641 à 1517","summary":"Conquête arabe, fondation du Caire par les Fatimides, Saladin et sa citadelle, sultanat mamelouk.","keyFigures":["Amr ibn al-As","Al-Muizz","Saladin","Baybars"]},{"period":"Époque ottomane","dates":"1517 à 1798","summary":"L'Égypte devient une province de l'Empire ottoman, gouvernée par des pachas et les beys mamelouks.","keyFigures":["Sélim Ier"]},{"period":"Égypte moderne et contemporaine","dates":"1798 à aujourd'hui","summary":"Expédition de Bonaparte, dynastie de Mohamed Ali, canal de Suez, protectorat britannique, révolution de Nasser et République.","keyFigures":["Bonaparte","Mohamed Ali","Nasser","Sadate"]}],"entries":[{"id":"saqqarah-djoser","title":"Saqqarah et Memphis : le berceau de l'Égypte","days":[2],"locations":["Sakkarah","Memphis"],"sites":["Pyramide à degrés de Djoser (Saqqarah)","Memphis"],"body":"Avant Gizeh, il y a Saqqarah. Nous sommes ici à la nécropole de **Memphis**, la première capitale de l'Égypte unifiée, fondée selon la légende par le roi Ménès vers -3100 au point stratégique où la vallée s'ouvre sur le delta. De la ville, jadis immense, ne subsistent que quelques vestiges et un colosse couché de Ramsès II : le limon du Nil a tout recouvert.\n\nLa vedette de Saqqarah, c'est la **pyramide à degrés de Djoser** (vers -2670), le plus ancien grand monument de pierre au monde. Un siècle avant Khéops, l'architecte **Imhotep** — génie si admiré qu'il fut plus tard divinisé — a l'idée d'empiler six mastabas (tombes en forme de banc) de taille décroissante. La pyramide était née. Autour d'elle s'étend un vaste complexe funéraire ceint d'un mur, avec cour du jubilé et fausses portes, entièrement restauré et rouvert en 2020.\n\nSaqqarah n'a pas livré tous ses secrets, loin de là. Depuis 2018, les archéologues y font des découvertes spectaculaires : des centaines de sarcophages colorés, des ateliers de momification, et en 2024-2025 le tombeau d'un **médecin royal**, Tétinebefou, et celui du prince **Ouserefrê**, fils du pharaon Ouserkaf, avec une fausse porte en granit rose de près de cinq mètres. On y a même retrouvé des statues de Djoser lui-même.\n\nSur place, cherchez la finesse des colonnes cannelées imitant des tiges de roseau : l'architecte traduit dans la pierre éternelle des formes végétales fragiles. Ne manquez pas les tombes de nobles voisines (Ti, Mérérouka) aux bas-reliefs d'une fraîcheur incroyable, scènes de chasse, de pêche et de vie quotidienne.","funFact":"Imhotep, l'inventeur de la pyramide, est l'un des rares hommes non royaux à être devenu un dieu à part entière : les Égyptiens en firent le patron de la médecine, que les Grecs assimilèrent à Asclépios."},{"id":"gizeh-pyramides","title":"Les pyramides de Gizeh : la dernière merveille du monde","days":[2],"locations":["Gizeh"],"sites":["Pyramide de Khéops","Pyramide de Khephren","Pyramide de Mykérinos","Pyramides des reines"],"body":"Trois pyramides, trois pharaons de la **IVe dynastie**, un même siècle prodigieux (vers -2600 à -2500). La **grande pyramide de Khéops** est la seule des sept merveilles du monde antique encore debout. Haute à l'origine de 146 mètres (137 aujourd'hui, ayant perdu son revêtement), elle a régné comme plus haut bâtiment du monde pendant près de 3 800 ans. Elle rassemble environ 2,3 millions de blocs de calcaire de 2,5 tonnes en moyenne, ajustés sans mortier avec une précision d'orfèvre.\n\nComment ? Non par des esclaves, contrairement au mythe hollywoodien, mais par des équipes d'ouvriers qualifiés et de paysans requis pendant la crue, logés et nourris dans une véritable ville de chantier retrouvée à côté. On sait aujourd'hui, grâce au papyrus de Merer découvert en 2013, comment les blocs de calfage étaient acheminés depuis les carrières par bateau.\n\nLa deuxième, celle de **Khephren**, paraît plus haute car bâtie sur un socle plus élevé ; elle conserve à son sommet une coiffe de son revêtement de calcaire poli d'origine. La troisième, celle de **Mykérinos**, plus modeste, était en partie habillée de granit rose d'Assouan. À leurs pieds s'alignent les petites **pyramides des reines** et des champs de mastabas.\n\nSur place, levez les yeux vers l'angle : la lumière rasante du matin ou du soir révèle le fruit parfait des faces. Si vous entrez dans Khéops (billet séparé, montée physique et étroite), vous grimperez la spectaculaire Grande Galerie vers la chambre du roi, entièrement en granit. Emportez de l'eau et laissez sacs et appareils : l'intérieur est nu, mais l'émotion d'être au cœur de la montagne de Khéops est totale.","funFact":"La base de la grande pyramide est presque parfaitement orientée selon les points cardinaux, avec une erreur inférieure à un dixième de degré — une précision que les bâtisseurs ont atteinte sans boussole, sans doute grâce aux étoiles."},{"id":"sphinx-gizeh","title":"Le Sphinx : le gardien au visage effacé","days":[2],"locations":["Gizeh"],"sites":["Sphinx de Gizeh"],"body":"Corps de lion, tête d'homme coiffée du némès royal : le **grand Sphinx de Gizeh** est la plus grande sculpture monolithique du monde, taillée directement dans un éperon de calcaire du plateau. Il mesure 73 mètres de long et 20 mètres de haut. On l'attribue généralement au pharaon **Khephren** (vers -2500), dont il garderait le complexe funéraire, et son visage serait le sien — mais le débat reste ouvert et certains y voient Khéops.\n\nLe Sphinx incarne la royauté solaire : le lion, animal solaire par excellence, portant le visage du roi, veille face au levant. Les Égyptiens du Nouvel Empire le vénéraient sous le nom d'**Horemakhet**, « Horus dans l'horizon ». Entre ses pattes, la fameuse **stèle du Songe** raconte comment le prince Thoutmôsis IV, endormi à l'ombre du monument à demi enseveli, rêva que le Sphinx lui promettait le trône s'il le dégageait du sable. Devenu pharaon, il tint parole.\n\nCar le Sphinx a passé le plus clair de son existence enfoui jusqu'au cou : c'est ce qui l'a préservé de l'érosion. Son nez manquant n'a rien à voir avec les canons de Bonaparte (légende tenace) ; il fut probablement brisé bien avant, peut-être au XIVe siècle. La barbe postiche, elle, est en partie au British Museum.\n\nSur place, la meilleure vue s'obtient depuis le temple de la vallée de Khephren, en contrebas, dont les colossaux piliers de granit rose encore en place donnent la mesure du génie constructeur de l'époque. Le soir, un spectacle son et lumière fait parler le gardien de pierre.","funFact":"Le Sphinx portait à l'origine une barbe postiche et, probablement, un nez qui a disparu depuis des siècles ; l'idée qu'un boulet français l'aurait détruit est un mythe, car des dessins antérieurs à Bonaparte le montrent déjà sans nez."},{"id":"caire-islamique","title":"Le Caire islamique : citadelle, Mohamed Ali et Khan el-Khalili","days":[2],"locations":["Le Caire"],"sites":["Citadelle de Saladin","Mosquée de Mohamed Ali","Souk de Khan el-Khalili"],"body":"Le Caire est né musulman. Après la conquête arabe de 641, le général Amr ibn al-As fonde Fostat, premier noyau urbain ; puis en 969 les **Fatimides** chiites créent une ville nouvelle qu'ils nomment *Al-Qahira*, « la Victorieuse » — Le Caire. Elle deviendra l'une des plus grandes métropoles du monde médiéval, foisonnante de mosquées, de médersas et de marchés.\n\nLa **citadelle** qui domine la ville est l'œuvre de **Saladin** (Salah al-Din), le sultan qui reprit Jérusalem aux croisés. Il la fait bâtir à partir de 1176 sur un éperon des collines du Moqattam pour protéger la cité. Elle restera le siège du pouvoir égyptien pendant près de sept siècles.\n\nLa silhouette qui la couronne, avec ses dômes et ses deux minarets élancés « à la turque », est bien plus récente : c'est la **mosquée de Mohamed Ali**, dite mosquée d'albâtre, construite entre 1830 et 1848. **Mohamed Ali**, vice-roi d'origine albanaise, est le fondateur de l'Égypte moderne ; il fit édifier ce monument sur le modèle des grandes mosquées ottomanes d'Istanbul, en hommage à son fils défunt, et y repose lui-même. De la terrasse, le panorama sur la ville et, au loin, les pyramides, est saisissant.\n\nLe soir, plongez dans **Khan el-Khalili**, le grand souk fondé au XIVe siècle par un émir mamelouk. Épices, cuivre martelé, parfums, bijoux, narguilés : c'est un labyrinthe vivant, où l'on marchande autour d'un thé à la menthe ou d'un café à la cardamome. Faites une pause au café El Fishawy, ouvert depuis plus de deux siècles et cher au grand écrivain Naguib Mahfouz.","funFact":"La mosquée de Mohamed Ali possède une horloge offerte par le roi Louis-Philippe de France en échange de l'obélisque de Louqsor, aujourd'hui place de la Concorde à Paris — mais l'horloge, endommagée à l'arrivée, n'a quasiment jamais fonctionné."},{"id":"grand-musee-egyptien","title":"Le Grand Musée Égyptien (GEM) : le plus grand musée d'une civilisation","days":[3],"locations":["Gizeh"],"sites":["Grand Musée Égyptien (GEM)"],"body":"C'est l'événement culturel de la décennie. Après plus de vingt ans de chantier et de reports successifs, le **Grand Musée Égyptien** a été officiellement inauguré le **1er novembre 2025** et ouvert au public le 4 novembre 2025. Vous le visitez donc alors qu'il est tout neuf et pleinement ouvert.\n\nPlanté au pied des pyramides de Gizeh, avec lesquelles il dialogue à travers d'immenses baies vitrées, le GEM est le plus grand musée au monde consacré à une seule civilisation : plus de 90 hectares, douze salles principales et une collection de plus de 100 000 objets. Dès l'entrée, on est accueilli par le **colosse de Ramsès II** de onze mètres, dressé dans l'atrium, puis par un spectaculaire escalier monumental jalonné de statues royales qui monte vers les galeries, face au plateau de Gizeh.\n\nLe clou du musée : pour la première fois, l'**intégralité du trésor de Toutânkhamon** — plus de 5 000 objets — est réunie et exposée au même endroit, dont le célèbre masque funéraire en or. Beaucoup de ces pièces n'avaient jamais été montrées au public depuis leur découverte par Howard Carter en 1922. Le GEM abrite aussi la barque solaire de Khéops, un vaisseau de cèdre long de 42 mètres enterré à côté de la grande pyramide pour le voyage du roi dans l'au-delà.\n\nSur place, prévoyez du temps et de bonnes chaussures : les distances sont grandes. La lumière naturelle, la muséographie moderne et les vues sur les pyramides changent radicalement l'expérience par rapport à l'ancien musée de la place Tahrir. Ne manquez pas, en fin de parcours, l'alignement magique entre l'escalier, la façade de verre et les trois pyramides à l'horizon.","funFact":"Le déménagement des pièces les plus fragiles fut une opération quasi militaire : le colosse de Ramsès II, 83 tonnes, a voyagé de nuit à travers Le Caire à quelques kilomètres-heure, et le musée a été conçu pour que sa grande verrière cadre précisément les pyramides."},{"id":"temple-philae","title":"Philae : le dernier refuge d'Isis","days":[4],"locations":["Assouan","Île de Philae"],"sites":["Temple d'Isis de Philae"],"body":"Sur une île posée au milieu du Nil, à Assouan, le **temple d'Isis de Philae** est l'un des sanctuaires les plus gracieux d'Égypte. Il fut commencé sous **Nectanébo Ier** (XXXe dynastie, vers -370) et surtout construit par les **Ptolémées** grecs et achevé par les **Romains** — d'où son air à la fois pharaonique et tardif, avec ses kiosques élégants dont le célèbre « kiosque de Trajan ».\n\nPhilae était le grand centre du culte d'**Isis**, déesse de l'amour, de la magie et de la maternité, épouse d'Osiris et mère d'Horus. Sa renommée dépassait l'Égypte : on venait de tout le monde méditerranéen l'y vénérer. Ce fut le dernier temple païen d'Égypte à rester actif : ses prêtres continuèrent d'y graver des hiéroglyphes jusqu'au VIe siècle après J.-C., bien après la christianisation du pays. La toute dernière inscription hiéroglyphique connue (394 apr. J.-C.) provient d'ailleurs de Philae.\n\nMais le temple que vous visitez n'est plus sur son île d'origine ! Après la construction des barrages d'Assouan, Philae se retrouva noyée une bonne partie de l'année. Dans les années 1970-1980, l'UNESCO le démonta bloc par bloc (près de 40 000) et le remonta à l'identique sur l'île voisine d'**Aguilkia**, spécialement aménagée. On y accède aujourd'hui en barque.\n\nSur place, cherchez les images d'Isis allaitant Horus enfant, dont les historiens de l'art voient un lointain modèle des Vierges à l'Enfant chrétiennes. Repérez aussi les croix coptes gravées par les premiers chrétiens et les visages martelés : la trace du basculement des religions. En soirée, un beau spectacle son et lumière anime les colonnades.","funFact":"Sur les murs de Philae, un moine chrétien du VIe siècle a laissé une inscription se réjouissant d'avoir « aboli » le culte d'Isis — mettant ainsi un point final, gravé dans la pierre, à trois mille ans de religion pharaonique."},{"id":"ile-elephantine","title":"L'île Éléphantine : la porte de l'Afrique","days":[4],"locations":["Assouan","Île Éléphantine"],"sites":["Île Éléphantine"],"body":"En felouque, à la voile latine, vous glissez autour de l'**île Éléphantine**, au cœur d'Assouan. Son nom, hérité du grec, viendrait de sa forme ou du commerce de l'ivoire qui y transitait. Car Éléphantine fut, durant des millénaires, la **frontière sud de l'Égypte** et sa porte vers la Nubie et l'Afrique : ici finissait le monde pharaonique, ici commençait le pays de l'or, de l'ébène, de l'encens et des peaux de panthère.\n\nL'île abritait une ville de garnison et de douane très ancienne, dont les fouilles ont révélé des strates remontant à l'aube de l'histoire égyptienne. On y vénérait la triade d'Assouan : **Khnoum**, le dieu-bélier qui façonnait les humains sur son tour de potier, son épouse Satis et leur fille Anoukis, divinités des cataractes et de la crue.\n\nC'est ici qu'on mesurait le Nil. Le **nilomètre** d'Éléphantine, un escalier de pierre gradué descendant vers le fleuve, permettait de lire la hauteur de la crue annuelle. De ce chiffre dépendait tout : une bonne crue annonçait des récoltes abondantes — et donc le montant des impôts, calculés d'avance par l'administration. Éléphantine était ainsi le baromètre économique de tout le pays.\n\nSur place, au-delà des vestiges du temple de Khnoum et du nilomètre, ne manquez pas les villages **nubiens** aux maisons peintes de bleu, d'ocre et de motifs colorés, où subsiste une culture distincte de l'Égypte du Nord. C'est l'occasion d'un thé à l'hibiscus (le *karkadé*) et d'un aperçu de cette Nubie dont une grande partie a été engloutie par le lac Nasser.","funFact":"Sur l'île voisine de Séhel, une inscription rupestre tardive — la « stèle de la famine » — prétend raconter comment le pharaon Djoser mit fin à sept années de disette en restaurant le culte de Khnoum, écho égyptien étonnant du récit biblique de Joseph."},{"id":"haut-barrage-assouan","title":"Le haut barrage d'Assouan : la fierté de l'Égypte de Nasser","days":[4],"locations":["Assouan"],"sites":["Haut barrage d'Assouan"],"body":"Pour comprendre l'Égypte contemporaine, il faut voir le **haut barrage d'Assouan** (*Sadd el-Ali*). Cet immense ouvrage de terre et de roc, long de près de 4 kilomètres, retient le Nil pour former le **lac Nasser**, l'un des plus grands lacs artificiels du monde, qui s'étend sur 500 kilomètres jusqu'au Soudan.\n\nSon histoire est aussi politique que technique. Au début des années 1950, le colonel **Nasser**, héros de la révolution de 1952, veut doter l'Égypte d'une infrastructure qui maîtrise enfin la crue capricieuse du Nil, gagne des terres agricoles et produise de l'électricité. Quand les États-Unis et le Royaume-Uni lui refusent le financement en 1956, Nasser réplique en **nationalisant le canal de Suez** — déclenchant une crise internationale majeure. C'est finalement l'**Union soviétique** qui financera et fera construire le barrage, achevé en 1970. Il devint le symbole même de l'Égypte indépendante et non-alignée.\n\nLes bénéfices furent réels : fin des crues dévastatrices et des sécheresses, irrigation permanente, production massive d'hydroélectricité. Mais le prix fut lourd. La montée des eaux a noyé une grande partie de la **Nubie**, forçant le déplacement de dizaines de milliers d'habitants et menaçant des temples entiers — d'où la spectaculaire campagne de sauvetage de l'UNESCO qui déplaça Abou Simbel et Philae. Le limon fertilisant, jadis déposé par la crue, reste désormais piégé derrière le barrage, obligeant à recourir aux engrais.\n\nSur place, on découvre un monument moderne, un vaste plan d'eau et un mémorial en forme de fleur de lotus offert par l'URSS. La visite est brève mais éclaire tout le reste du voyage : sans ce barrage, ni votre croisière régulière, ni les temples relocalisés que vous admirez ne seraient ce qu'ils sont.","funFact":"En bloquant définitivement le limon du Nil, le barrage a mis fin à un cycle agricole de plus de 5 000 ans : les paysans égyptiens, qui comptaient depuis les pharaons sur la boue fertile de la crue, doivent aujourd'hui acheter des engrais chimiques."},{"id":"obelisque-inacheve","title":"L'obélisque inachevé : un chantier figé dans le granit","days":[4],"locations":["Assouan"],"sites":["Obélisque inachevé","Carrières de granit d'Assouan"],"body":"Dans les carrières de granit rose d'Assouan gît, encore à demi couché dans la roche mère, le plus grand obélisque jamais entrepris par les Égyptiens : l'**obélisque inachevé**. S'il avait été dressé, il aurait mesuré près de 42 mètres et pesé environ 1 100 tonnes — un tiers de plus que n'importe quel obélisque existant.\n\nOn attribue ce chantier titanesque à la reine **Hatchepsout** (XVe siècle av. J.-C.). Mais une longue fissure est apparue dans le granit au cours du dégrossissage : le monument aurait été fragile et voué à se briser. Les tailleurs l'ont donc abandonné sur place, définitivement soudé à sa carrière.\n\nEt c'est précisément ce qui en fait un site exceptionnel : c'est une **leçon de technologie antique** à ciel ouvert. On voit exactement comment les ouvriers attaquaient le granit, l'une des pierres les plus dures, sans outils de fer. Ils frappaient la roche avec des boules de dolérite encore plus dure, creusant patiemment des tranchées tout autour du bloc. On distingue les traces de ces coups, les rigoles, l'ébauche des faces. Un obélisque de cette taille demandait des mois, voire des années de travail à des centaines d'hommes.\n\nLes obélisques, ces aiguilles de pierre monolithes coiffées d'un pyramidion parfois doré, étaient des rayons de soleil pétrifiés, dressés par paires devant les temples à la gloire du dieu Rê. Beaucoup ont depuis quitté l'Égypte : Paris, Londres, New York, Rome et Istanbul en possèdent.\n\nSur place, imaginez l'effort colossal : extraire, tailler, transporter jusqu'au Nil, charger sur des barges géantes, remonter le fleuve, puis redresser à la force des rampes de sable un monolithe de mille tonnes. L'obélisque inachevé rend soudain crédibles tous les exploits que vous verrez ailleurs.","funFact":"L'obélisque de la Concorde, à Paris, vient du temple de Louqsor et fut offert à la France par Mohamed Ali ; il a fallu près de trois ans pour le descendre, le transporter et le redresser — un aperçu de la prouesse que représentait ce type d'opération dans l'Antiquité."},{"id":"abou-simbel","title":"Abou Simbel : la démesure de Ramsès II, sauvée des eaux","days":[5],"locations":["Abou Simbel"],"sites":["Grand temple de Ramsès II","Petit temple de Néfertari"],"body":"Aux confins sud de l'Égypte, face au lac Nasser, **Abou Simbel** est le chef-d'œuvre de la propagande pharaonique. Vers -1264, **Ramsès II** fait creuser à même la falaise deux temples destinés à impressionner la Nubie voisine. Le grand temple est gardé par quatre colosses assis du roi, hauts de 20 mètres, qui semblent surveiller la frontière. À l'intérieur, un couloir de piliers osiriaques mène à des salles couvertes de scènes de la bataille de **Qadesh**, où Ramsès se met en scène en héros invincible.\n\nLe petit temple, voisin, est dédié à la déesse Hathor et à l'épouse préférée du roi, la reine **Néfertari** — fait rarissime, elle y est représentée à la même taille que son royal époux, honneur exceptionnel pour une reine.\n\nMais le miracle d'Abou Simbel est double. Le premier est antique : le temple est orienté de telle sorte que, **deux fois par an** (aujourd'hui les 22 février et 22 octobre), les premiers rayons du soleil traversent tout le sanctuaire, sur 60 mètres, pour venir illuminer les statues du fond — tout en laissant dans l'ombre Ptah, dieu des ténèbres. Un calcul astronomique vieux de 3 300 ans.\n\nLe second miracle est moderne. Dans les années 1960, le lac Nasser allait engloutir les temples. L'**UNESCO** lança alors un sauvetage inouï : entre 1964 et 1968, les deux temples furent **découpés en plus de 1 000 blocs** de 20 à 30 tonnes, puis remontés à l'identique 65 mètres plus haut, à l'intérieur de collines artificielles creuses. L'orientation solaire fut recalculée. Le décalage n'est que d'un jour.\n\nSur place (excursion en option, tôt le matin), la première vision des colosses coupe le souffle. Comptez sur le désert, le silence et l'échelle écrasante des statues pour comprendre pourquoi Ramsès reste, pour les Égyptiens, « le Grand ».","funFact":"Lors du déplacement, les ingénieurs se sont trompés d'un seul jour dans le recalcul du fameux alignement solaire : le miracle qui se produisait le 21 a désormais lieu le 22 février et le 22 octobre."},{"id":"kom-ombo","title":"Kom Ombo : le temple double du crocodile","days":[5],"locations":["Kom Ombo"],"sites":["Temple de Kom Ombo"],"body":"Posé sur une boucle du Nil, le temple de **Kom Ombo** a une particularité unique en Égypte : c'est un **temple double**, rigoureusement symétrique, dédié à deux divinités à la fois. Tout y est en double, sur un axe de partage parfait — deux entrées, deux salles hypostyles, deux sanctuaires.\n\nLa moitié sud honore **Sobek**, le dieu-crocodile, seigneur de la fertilité et des eaux, redouté et vénéré dans cette région où le Nil grouillait de crocodiles. La moitié nord est consacrée à **Haroeris** (Horus l'Ancien), dieu-faucon guérisseur et solaire. Construit essentiellement par les **Ptolémées** (à partir du IIe siècle av. J.-C.) et complété par les Romains, le temple offre des reliefs remarquablement conservés et parfois surprenants.\n\nCar Kom Ombo est célèbre pour ses gravures « médicales » : sur un mur figure ce que beaucoup interprètent comme une collection d'**instruments chirurgicaux** — scalpels, pinces, ventouses, forceps, balances — témoignant du savoir médical de l'Égypte tardive. On y voit aussi une scène d'accouchement, chose exceptionnelle, et un curieux calendrier.\n\nJuste à côté, ne manquez pas le petit **musée du Crocodile** : on y a rassemblé des dizaines de crocodiles momifiés, retrouvés dans une nécropole voisine, du bébé au reptile de plusieurs mètres. Les fidèles offraient ces momies à Sobek ; le temple entretenait même des crocodiles sacrés vivants, parés de bijoux.\n\nSur place, arrivez si possible en fin d'après-midi : le temple, très photogénique, se dresse en surplomb du fleuve et la croisière y accoste souvent pour une visite au coucher du soleil, quand la pierre dorée prend des teintes de miel. Cherchez la ligne de symétrie parfaite au sol : de part et d'autre, chaque dieu a son domaine.","funFact":"Les prêtres de Sobek gardaient des crocodiles vivants dans un bassin sacré, les nourrissaient à la main et les paraient de boucles d'oreilles et de bracelets d'or ; à leur mort, ils étaient momifiés avec les honneurs — d'où les momies exposées au musée voisin."},{"id":"edfou","title":"Edfou : le temple d'Horus, le mieux conservé d'Égypte","days":[6],"locations":["Edfou"],"sites":["Temple d'Edfou"],"body":"Si vous ne deviez visiter qu'un seul temple pour comprendre à quoi ressemblait un sanctuaire égyptien intact, ce serait **Edfou**. C'est le temple le mieux préservé du pays, et le deuxième plus grand après Karnak. On y accède traditionnellement en calèche depuis le débarcadère de la croisière.\n\nDédié au dieu-faucon **Horus**, il fut bâti par les **Ptolémées** entre -237 et -57, sur près de deux siècles. Sa remarquable conservation tient à un paradoxe heureux : après l'interdiction des cultes païens, le temple fut peu à peu enseveli sous le sable et les maisons du village, ce qui le protégea des intempéries et des carriers. Ce n'est qu'au XIXe siècle qu'Auguste Mariette le dégagea.\n\nOn est d'abord saisi par le **pylône** monumental de 36 mètres, couvert de scènes où le pharaon massacre les ennemis devant Horus. Dans la cour, une magnifique statue du dieu en faucon de granit noir, coiffé de la double couronne, garde l'entrée. Plus loin, au cœur du temple, subsiste le **naos** monolithe et surtout une **barque sacrée** reconstituée : c'est dans une telle embarcation que l'on portait la statue du dieu en procession.\n\nLes murs racontent tout : le mythe d'Horus vengeant son père Osiris et combattant son oncle Seth (représenté en hippopotame que le faucon transperce), mais aussi, gravés en « mode d'emploi », les rites quotidiens, les fêtes, et jusqu'aux dimensions et à la fondation du temple. Edfou est une véritable encyclopédie de la religion égyptienne tardive.\n\nSur place, prenez le temps de monter (si accessible) ou d'imaginer la terrasse, et cherchez, dans la pénombre du sanctuaire, l'atmosphère de mystère que les prêtres entretenaient : seuls eux et le roi pouvaient approcher le dieu.","funFact":"Chaque année avait lieu la « belle fête de la rencontre » : la statue d'Horus d'Edfou remontait le Nil en procession fluviale jusqu'au temple de Dendérah pour y « épouser » la déesse Hathor — un mariage divin célébré avec quinze jours de fêtes."},{"id":"esna","title":"Esna : l'écluse et le temple aux couleurs retrouvées","days":[6],"locations":["Esna"],"sites":["Écluse d'Esna","Temple de Khnoum"],"body":"À mi-chemin entre Edfou et Louxor, votre bateau doit franchir l'**écluse d'Esna**, seul passage régulé sur cette portion du Nil. C'est un moment étonnant de la croisière : le navire s'engage dans un sas étroit où de petites barques de vendeurs viennent parfois lancer leurs marchandises jusqu'au pont. La différence de niveau, liée aux barrages en aval, y est régularisée pour permettre la navigation.\n\nMais Esna cache un joyau : le **temple de Khnoum**, dédié au dieu-bélier créateur qui façonnait les êtres sur son tour de potier. Le temple, d'époque **romaine** (Ier-IIIe siècle apr. J.-C.), se trouve aujourd'hui neuf mètres en contrebas du niveau de la ville moderne, dans une sorte de fosse, ce qui l'a préservé. Il n'en subsiste que la salle hypostyle, mais quelle salle : vingt-quatre colonnes aux chapiteaux tous différents (palmes, lotus, papyrus), couvertes de textes hiéroglyphiques parmi les plus tardifs et les plus savants d'Égypte.\n\nLe temple est revenu à la une de l'actualité : depuis 2018, une mission égypto-allemande a entrepris de **nettoyer le plafond et les colonnes** encrassés par des siècles de suie, de fientes et de poussière. Sous la crasse ont réapparu des **couleurs éclatantes** — bleus, verts, rouges, ors — d'une fraîcheur stupéfiante, ainsi que des représentations du zodiaque et des textes inédits. On redécouvre ainsi à quoi ressemblait vraiment un temple égyptien : non pas la pierre nue et beige des cartes postales, mais un festival de couleurs vives.\n\nSur place (si l'escale le permet), levez les yeux : ce plafond restauré est l'une des plus belles surprises du voyage. Sinon, l'écluse elle-même offre une pause pittoresque au fil de l'eau.","funFact":"Les hiéroglyphes d'Esna comptent parmi les plus sophistiqués jamais gravés : les prêtres tardifs, virtuoses, y ont composé des hymnes que l'on peut lire uniquement avec des signes de crocodiles, ou uniquement avec des signes de béliers — des jeux d'érudition presque intraduisibles."},{"id":"karnak-louxor","title":"Karnak et le temple de Louxor : le domaine du dieu Amon","days":[6],"locations":["Louxor (Thèbes)"],"sites":["Temple de Karnak","Temple de Louxor","Allée des sphinx (dromos)"],"body":"Bienvenue à **Thèbes**, la capitale religieuse du Nouvel Empire, l'antique cité aux cent portes chantée par Homère. Sur la rive est du Nil, celle des vivants et du soleil levant, s'élèvent deux temples colossaux dédiés à **Amon**, le dieu suprême de l'Empire, roi des dieux, autrefois divinité locale devenue toute-puissante avec la fortune de Thèbes.\n\n**Karnak** n'est pas un temple mais une ville de temples, agrandie sans relâche pendant plus de 2 000 ans par des dizaines de pharaons — chacun voulant marquer sa piété. On y entre par une allée de sphinx à tête de bélier, puis on débouche dans l'inoubliable **grande salle hypostyle** : 134 colonnes gigantesques, hautes de 15 à 23 mètres, plantées comme une forêt de pierre où l'homme se sent minuscule. Récemment nettoyées, certaines révèlent à nouveau leurs couleurs d'origine. Partout, obélisques (dont celui d'Hatchepsout), statues, lac sacré et chapelles se succèdent.\n\nÀ trois kilomètres de là, le **temple de Louxor**, plus ramassé et harmonieux, fut érigé au XIVe siècle av. J.-C. par **Amenhotep III**, puis agrandi par **Ramsès II**, qui en orna l'entrée d'un pylône, de colosses et de deux obélisques (l'un est aujourd'hui à Paris). Ce temple était le lieu de la grande fête d'**Opet**, où la statue d'Amon quittait Karnak pour venir « régénérer » chaque année le pouvoir du pharaon.\n\nLes deux sanctuaires étaient reliés par un **dromos** de près de 2,7 kilomètres, bordé de plus d'un millier de sphinx : l'allée des sphinx, entièrement restaurée et rouverte en grande pompe en 2021.\n\nSur place, visitez Karnak le matin pour la lumière et Louxor plutôt en soirée : illuminé, il est magique. Un spectacle son et lumière est proposé à Karnak.","funFact":"La grande salle hypostyle de Karnak est si vaste qu'on pourrait y faire tenir la cathédrale Notre-Dame de Paris ; ses colonnes centrales, les plus hautes, étaient couronnées de chapiteaux en fleur de papyrus épanouie assez larges pour que cent hommes tiennent debout au sommet de chacune."},{"id":"vallee-des-rois","title":"La Vallée des Rois : la demeure d'éternité des pharaons","days":[7],"locations":["Louxor (Thèbes)"],"sites":["Vallée des Rois","Tombe de Toutânkhamon"],"body":"Sur la rive ouest de Thèbes, celle des morts et du soleil couchant, s'ouvre un vallon désertique dominé par un pic pyramidal naturel, la cime thébaine. C'est la **Vallée des Rois**, où, pendant près de cinq siècles (du XVIe au XIe av. J.-C.), les pharaons du **Nouvel Empire** se firent creuser des tombes secrètes.\n\nPourquoi abandonner les pyramides ? Précisément parce qu'elles attiraient les pilleurs. Les rois du Nouvel Empire choisirent au contraire de cacher leurs sépultures : des tombes profondes, creusées dans la roche, aux entrées dissimulées, à l'écart, sous la garde d'une montagne en forme de pyramide naturelle. Peine perdue : presque toutes furent tout de même pillées dès l'Antiquité.\n\nPresque toutes. En **1922**, Howard Carter découvrit la seule restée quasi intacte : celle de **Toutânkhamon**, un pharaon mineur mort à 19 ans, dont le fabuleux trésor (aujourd'hui au GEM) fit le tour du monde. Imaginez alors ce que devaient contenir les tombes des grands rois…\n\nLa vallée compte plus de 60 tombes. Les murs ne montrent pas la vie quotidienne, mais des **textes funéraires** — le Livre des Morts, le Livre de l'Amdouat, le Livre des Portes — véritables cartes du voyage nocturne du roi à travers le monde souterrain, aux côtés du soleil, pour renaître à l'aube. Les couleurs, protégées de la lumière, sont souvent d'une fraîcheur bouleversante.\n\nEn 2025, l'actualité a rappelé que la vallée n'a pas dit son dernier mot : on a identifié tout près de là la **tombe de Thoutmôsis II**, première tombe royale retrouvée depuis Toutânkhamon.\n\nSur place, le billet donne accès à trois tombes (Ramsès, Séthi, Mérenptah… selon les ouvertures) ; celles de Toutânkhamon, Séthi Ier et Néfertari se paient en supplément mais valent l'investissement. Interdiction de photographier sans billet photo. Chapeau, eau et chaussures fermées : il fait très chaud.","funFact":"La tombe de Séthi Ier, la plus grande et la plus richement décorée de la vallée, descend sur plus de 130 mètres ; son plafond astronomique bleu nuit constellé d'étoiles dorées est considéré comme un sommet absolu de l'art égyptien."},{"id":"vallee-des-reines","title":"La Vallée des Reines : Néfertari et les enfants royaux","days":[7],"locations":["Louxor (Thèbes)"],"sites":["Vallée des Reines","Tombe de Néfertari"],"body":"À l'écart de la Vallée des Rois, dans un autre vallon de la rive ouest thébaine, s'étend la **Vallée des Reines**. Les anciens Égyptiens l'appelaient *Ta Set Neferou*, « la place des beautés » ou « des enfants royaux ». On y a inhumé, durant le Nouvel Empire, les épouses des pharaons, mais aussi des princes et princesses morts jeunes, et quelques hauts dignitaires.\n\nLe joyau absolu de la vallée est la **tombe de Néfertari**, la grande épouse royale bien-aimée de **Ramsès II**. Découverte en 1904, elle est unanimement considérée comme la plus belle tombe de toute l'Égypte, une « chapelle Sixtine » de l'art pharaonique. Sur fond blanc lumineux, la reine, d'une élégance parfaite, coiffée de la dépouille de vautour et d'une robe de lin transparente, y est guidée par les dieux à travers l'au-delà. Les couleurs — bleus profonds, ors, rouges — sont d'une fraîcheur presque irréelle après 3 200 ans.\n\nSi fragile qu'elle fut longtemps fermée, la tombe de Néfertari n'est aujourd'hui accessible qu'en nombre très limité, pour une durée courte et un billet spécial coûteux. Si elle est ouverte lors de votre passage et que le budget le permet, n'hésitez pas : c'est une expérience inoubliable.\n\nD'autres tombes se visitent, notamment celles des jeunes princes fils de **Ramsès III**, comme Amonherkhépeshef, où l'on voit le pharaon présenter tendrement son fils aux divinités — des images d'une douceur touchante, marquées par le deuil d'enfants disparus trop tôt.\n\nSur place, la vallée est plus intime et moins fréquentée que celle des Rois. Renseignez-vous à l'avance sur l'ouverture de Néfertari, car elle est intermittente. Comme partout sur la rive ouest, protégez-vous du soleil.","funFact":"Pour peindre Néfertari sur un fond aussi éclatant, les artistes ont recouvert la roche calcaire de mauvaise qualité d'une couche de plâtre, puis modelé les reliefs en léger relief avant de les colorer — une technique de stuc qui donne à ses fresques leur relief et leur luminosité uniques."},{"id":"colosses-memnon","title":"Les colosses de Memnon : les géants qui chantaient","days":[7],"locations":["Louxor (Thèbes)"],"sites":["Colosses de Memnon"],"body":"Deux statues assises de pierre, hautes de 18 mètres, se dressent solitaires au milieu des champs de la rive ouest, sur la route des tombeaux. Ce sont les **colosses de Memnon**, et ils représentent le pharaon **Amenhotep III** (XIVe siècle av. J.-C.), assis, mains sur les genoux, le regard tourné vers le levant.\n\nCes deux géants ne sont que les gardiens survivants d'un ensemble aujourd'hui disparu : le **temple funéraire d'Amenhotep III**, jadis le plus vaste de toute la rive thébaine, plus grand encore que Karnak. Le Nil, les crues et surtout les pharaons suivants, qui y puisèrent des matériaux, l'ont fait disparaître presque entièrement. Il ne reste, sentinelles esseulées, que ces deux colosses qui en marquaient l'entrée.\n\nLeur célébrité vient d'un phénomène étrange. Un tremblement de terre, en -27, fissura le colosse nord. Dès lors, à l'aube, la statue se mit à émettre un son mystérieux — un chant, un gémissement, un tintement — sans doute provoqué par la rosée et la dilatation de la pierre au premier soleil. Les Grecs et les Romains y virent un prodige : ils identifièrent la statue à **Memnon**, héros éthiopien de la guerre de Troie tué par Achille, qui saluait ainsi chaque matin sa mère Aurore, l'aurore. De tout l'Empire, les touristes antiques accoururent ; certains, dont l'empereur **Hadrien**, gravèrent leurs graffitis émerveillés sur les jambes du colosse, encore lisibles aujourd'hui.\n\nHélas, une restauration romaine vers 199 apr. J.-C. fit taire le géant à jamais.\n\nSur place, la halte est brève mais chargée d'histoire : ces colosses sont l'un des plus anciens sites touristiques du monde, admirés en continu depuis plus de deux mille ans. Cherchez, sur les côtés des trônes, les figures du Nil unissant la Haute et la Basse-Égypte.","funFact":"Le « chant » de Memnon fut l'une des grandes attractions touristiques de l'Antiquité : on venait de tout l'Empire romain espérer l'entendre à l'aube, et l'on tenait pour un présage heureux d'avoir la chance de percevoir la voix du colosse."},{"id":"deir-el-bahari","title":"Deir el-Bahari : le temple d'Hatchepsout, la femme-pharaon","days":[7],"locations":["Louxor (Thèbes)"],"sites":["Temple funéraire d'Hatchepsout (Deir el-Bahari)"],"body":"Adossé à une falaise vertigineuse, sur la rive ouest de Thèbes, le temple de **Deir el-Bahari** est l'un des monuments les plus élégants et les plus modernes d'aspect de toute l'Égypte antique. Ses trois vastes terrasses reliées par des rampes, ses colonnades géométriques épurées, épousent la muraille de roche dans une harmonie saisissante. Il fut bâti vers -1470 pour la reine **Hatchepsout**.\n\nHatchepsout est l'une des rares femmes à avoir régné en pharaon à part entière. Épouse et demi-sœur de Thoutmôsis II, elle prend le pouvoir à la mort de celui-ci, d'abord comme régente du jeune Thoutmôsis III, puis se fait couronner roi. Pour légitimer l'inconcevable — une femme sur le trône des Deux Terres —, elle se fait représenter en homme, portant le pagne et la fausse barbe royale, et proclame sa naissance divine, fille du dieu Amon lui-même : ces scènes ornent le temple.\n\nSon règne d'une vingtaine d'années fut prospère et pacifique. Le temple célèbre notamment sa fameuse **expédition au pays de Pount** (probablement la corne de l'Afrique), d'où ses navires rapportèrent or, ivoire, myrrhe et arbres à encens — les reliefs montrent jusqu'à l'obèse reine de Pount. Le sanctuaire est dédié à Amon, avec des chapelles pour Hathor et Anubis.\n\nAprès sa mort, Thoutmôsis III fit marteler ses images et effacer son nom, sans doute pour rétablir une succession « normale » : Hatchepsout faillit être rayée de l'histoire, et ce sont les archéologues modernes qui l'ont ressuscitée.\n\nSur place, le site est spectaculaire mais très exposé au soleil : venez tôt. Cherchez les visages martelés d'Hatchepsout, cicatrices de sa *damnatio memoriae*, et les colonnes osiriaques de la terrasse supérieure. C'est aussi ici qu'eut lieu, en 1997, un dramatique attentat contre des touristes, aujourd'hui bien loin ; le site est parfaitement sécurisé.","funFact":"Longtemps « perdue », la momie d'Hatchepsout n'a été formellement identifiée qu'en 2007, grâce à… une dent : une molaire conservée dans un coffret à son nom s'emboîtait parfaitement dans la mâchoire d'une momie anonyme, révélant la reine oubliée."},{"id":"hieroglyphes-champollion","title":"Les hiéroglyphes et Champollion : quand la pierre a repris la parole","days":[2,6,7],"locations":["Le Caire","Louxor (Thèbes)"],"sites":["Pierre de Rosette","Temples et tombes"],"body":"Partout dans votre voyage, les murs sont couverts de **hiéroglyphes**, ces signes gravés en forme d'oiseaux, de serpents, d'yeux et de roseaux. Contrairement à une idée reçue, ce ne sont pas de simples « dessins » symboliques : c'est une véritable **écriture**, apparue vers -3200, où les signes notent tantôt des sons (comme notre alphabet), tantôt des idées, tantôt des indices de sens. Le mot grec *hieroglyphe* signifie « gravure sacrée ».\n\nPendant des siècles, ce savoir fut perdu. Le dernier hiéroglyphe connu fut gravé à Philae en 394 apr. J.-C. ; ensuite, plus personne ne sut les lire. On croyait à un code mystique, et des érudits s'y cassèrent les dents pendant plus de mille ans.\n\nLe déblocage vint d'un hasard militaire. En 1799, pendant l'expédition de **Bonaparte**, des soldats français découvrent près de Rosette, dans le delta, une stèle de granit noir portant le même texte en **trois écritures** : hiéroglyphes, démotique (égyptien cursif) et grec. La **pierre de Rosette** — aujourd'hui au British Museum — offrait enfin une clé : on pouvait lire le grec.\n\nLe génie qui força la serrure fut un Français, **Jean-François Champollion**. Passionné de langues orientales dès l'enfance, il comprit, en 1822, que les hiéroglyphes mêlaient signes phonétiques et idéogrammes, et parvint à déchiffrer les noms royaux enfermés dans les cartouches (Ptolémée, Cléopâtre, puis Ramsès). « Je tiens l'affaire ! », se serait-il écrié avant de s'évanouir d'émotion. L'égyptologie était née, et trois mille ans d'histoire redevenaient lisibles.\n\nSur place, amusez-vous à repérer les **cartouches** : ces ovales entourant un nom royal, protégés par une boucle magique. Cherchez aussi les signes récurrents — l'ânkh (croix de vie), le scarabée (renaissance), l'œil oudjat (protection). Une fois qu'on sait que ces murs *parlent*, chaque temple devient un livre ouvert.","funFact":"Champollion réalisa enfin son rêve de fouler le sol égyptien en 1828, six ans après son déchiffrement ; parcourant les temples, il put lire à voix haute des inscriptions que personne n'avait comprises depuis quatorze siècles, vérifiant sur place que sa méthode fonctionnait."},{"id":"momification","title":"La momification : préparer le corps pour l'éternité","days":[3,7],"locations":["Louxor (Thèbes)","Le Caire"],"sites":["Vallée des Rois","Grand Musée Égyptien (GEM)"],"body":"Pour les Égyptiens, la mort n'était pas une fin mais un passage. Encore fallait-il que l'âme retrouve un corps reconnaissable : d'où l'art de la **momification**, destiné à préserver la dépouille pour l'éternité. Cette obsession de survie explique une grande part de ce que vous voyez — tombes, temples funéraires, trésors.\n\nLe procédé, perfectionné sur des millénaires, durait environ **70 jours**. Les embaumeurs, prêtres travaillant sous le masque d'Anubis, retiraient d'abord le cerveau — souvent par le nez, à l'aide d'un crochet — car on ne lui accordait aucune valeur. Puis, par une incision au flanc, ils ôtaient les viscères (foie, poumons, estomac, intestins), conservés à part dans quatre **vases canopes** placés sous la protection des quatre fils d'Horus. Le **cœur**, lui, était laissé en place : siège de l'intelligence et de la conscience, il serait pesé lors du jugement.\n\nLe corps était ensuite déshydraté pendant quarante jours sous le **natron**, un sel naturel du désert, puis lavé, enduit d'huiles et de résines parfumées, et enfin enveloppé de centaines de mètres de **bandelettes de lin**, entre lesquelles on glissait des amulettes protectrices — dont le scarabée de cœur. Un masque funéraire recouvrait le visage.\n\nMais la momification physique ne suffisait pas : elle s'accompagnait de rites, dont l'**ouverture de la bouche**, cérémonie touchant la momie pour lui rendre l'usage de ses sens dans l'au-delà, et de la récitation du **Livre des Morts**, recueil de formules magiques pour franchir les épreuves du monde souterrain et affronter la pesée du cœur, jugé contre la plume de Maât, déesse de la vérité.\n\nSur place, au GEM comme dans les tombes de la Vallée des Rois, cherchez les vases canopes, les représentations d'Anubis penché sur la momie, et la fameuse scène de la pesée du cœur — clé de voûte de toute la spiritualité égyptienne.","funFact":"L'âme qui échouait au jugement était dévorée par la « Grande Dévoreuse », Ammout, monstre à tête de crocodile, corps de lion et arrière-train d'hippopotame — les trois animaux les plus redoutés des Égyptiens, réunis en un seul cauchemar."},{"id":"pantheon-dieux","title":"Le panthéon égyptien : dieux, déesses et mythes fondateurs","days":[4,5,6],"locations":["Assouan","Kom Ombo","Edfou","Louxor (Thèbes)"],"sites":["Temples de la croisière"],"body":"Impossible de comprendre les temples sans connaître leurs habitants divins. La religion égyptienne comptait des centaines de dieux, souvent représentés à corps humain et tête d'animal — non que les Égyptiens adorassent des bêtes, mais parce que chaque animal symbolisait une qualité du dieu (la ruse du chacal, la force du taureau, l'envol du faucon).\n\nAu sommet, les divinités **solaires** : **Rê** (ou Râ), le soleil créateur, qui traverse le ciel le jour et les enfers la nuit ; et **Amon**, dieu de Thèbes devenu roi des dieux au Nouvel Empire, fusionné en **Amon-Rê**. C'est à lui que sont dédiés Karnak et Louxor.\n\nLe grand mythe, celui qu'on retrouve gravé partout, est celui d'**Osiris**. Roi bon, il est assassiné et démembré par son frère jaloux **Seth**, dieu du désert et du chaos. Son épouse **Isis**, magicienne, rassemble les morceaux, le ranime le temps de concevoir un fils, et devient la déesse de l'amour et de la protection (culte de Philae). Osiris devient alors le souverain du royaume des morts. Leur fils **Horus**, le faucon, grandit pour venger son père, combat Seth et reçoit le trône : chaque pharaon vivant est un Horus, chaque pharaon mort devient un Osiris. Tout le pouvoir royal découle de ce mythe (temple d'Edfou).\n\nAutour d'eux gravite un peuple divin : **Anubis**, le chacal des embaumeurs ; **Thot**, l'ibis, dieu de l'écriture et du savoir ; **Hathor**, la vache, déesse de l'amour, de la joie et de la musique ; **Sobek**, le crocodile (Kom Ombo) ; **Khnoum**, le bélier potier (Esna, Éléphantine) ; **Maât**, la plume de la vérité et de l'ordre cosmique ; **Bastet**, la chatte protectrice ; et **Ptah**, le dieu créateur de Memphis.\n\nSur place, apprenez à reconnaître les têtes : faucon (Horus/Rê), chacal (Anubis), ibis (Thot), crocodile (Sobek), bélier (Khnoum/Amon), vache ou disque entre des cornes (Hathor/Isis). Vous « lirez » alors les murs bien plus vite.","funFact":"Le pharaon Akhenaton tenta au XIVe siècle av. J.-C. une révolution inouïe : abolir tous ces dieux au profit d'un seul, le disque solaire Aton, sor
